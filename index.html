<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --line: #d5dce4;
    --accent: #1265c9;
    --accent-dim: #7fa8d6;
    --text: #14202e;
    --text-dim: #5c6c7d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    overflow: hidden;
  }
  #map {
    position: absolute;
    top: 140px;
    bottom: 0;
    left: 0;
    right: 0;
  }
  header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 84px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 1000;
  }
  .header-center {
    flex: 1;
    text-align: center;
    overflow: hidden;
    padding: 0 10px;
  }
  #infoBtn {
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    padding: 10px 15px;
    font-size: 15px;
    line-height: 1;
    font-style: italic;
  }
  #actionBar {
    position: absolute;
    top: 84px;
    left: 0;
    right: 0;
    height: 56px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0 14px;
    z-index: 1000;
  }
  .title {
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .status {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .radar {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 20px;
  }
  .radar div {
    width: 4px;
    background: var(--accent-dim);
  }
  .radar div.on {
    background: var(--accent);
  }
  button {
    background: var(--accent);
    color: #ffffff;
    border: none;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    font-weight: bold;
  }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
  }
  button:disabled {
    opacity: 0.5;
  }
  #panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 62%;
    background: var(--panel);
    border-top: 1px solid var(--accent-dim);

    overflow-y: auto;
    padding: 16px;
    display: none;
    font-family: 'IBM Plex Sans', Arial, sans-serif;
  }
  #panel.open {
    display: block;
  }
  #panel h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--accent);
    margin: 0 0 10px 0;
  }
  .meta-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 3px;
  }
  .question {
    margin: 14px 0 6px 0;
    font-size: 14px;
  }
  input[type=text], textarea {
    width: 100%;
    background: #f9fafb;
    border: 1px solid var(--line);

    font-family: inherit;
    font-size: 14px;
    margin-top: 4px;
  }
  textarea {
    min-height: 60px;

  }
  .panel-actions {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }
  #receiptFile { display: none; }
  .conf-low { border-color: #e07b00 !important; background: #fff7ec !important; }
  #searchPage {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    z-index: 3000;
    display: none;
    overflow-y: auto;
    font-family: 'IBM Plex Sans', Arial, sans-serif;
    color: var(--text);
  }
  #searchPage.open { display: block; }
  .sq-head {
    position: sticky; top: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--line);

  }
  .sq-filters { background: var(--panel); padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .sq-filters label { display: block; font-size: 11px; color: var(--text-dim); margin-top: 8px; }
  .sq-filters input, .sq-filters select {

  .sq-pair { display: flex; gap: 10px; }

  .sq-actions button { flex: 1; padding: 10px 4px; font-size: 11px; }
  .sq-summary { padding: 10px 14px; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; color: var(--accent); }
  .sq-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 14px; }
  .sq-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex: 0 0 auto; }
  .sq-main { flex: 1; min-width: 0; }
  .sq-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sq-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .sq-amt { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; flex: 0 0 auto; }
  .sq-empty { padding: 24px 14px; color: var(--text-dim); font-size: 14px; }
  #mapFilterBar {
    position: absolute; left: 10px; right: 10px; bottom: 14px; z-index: 900;
    background: var(--panel); border: 1px solid var(--accent-dim);
    display: none; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 10px; font-size: 12px;
  }
  #importInput { display: none; }
  #menuBtn {
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    padding: 10px 12px;
    font-size: 16px;
    line-height: 1;
  }
  #sideMenu {
    position: absolute;
    top: 0;
    right: -260px;
    bottom: 0;
    width: 240px;
    background: var(--panel);
    border-left: 1px solid var(--accent-dim);
    z-index: 1200;
    padding: 16px;
    transition: right 0.2s ease;
    overflow-y: auto;
  }
  #sideMenu.open {
    right: 0;
  }
  #sideMenu h3 {
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--accent);
    margin: 18px 0 8px 0;
  }
  #sideMenu h3:first-child {
    margin-top: 0;
  }
  .legend-row {
    font-size: 11px;
    line-height: 22px;
    color: var(--text);
  }
  .legend-row span.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 8px;
  }
  #sideMenu button {
    width: 100%;
    margin-bottom: 8px;
  }
  #menuOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 1100;
    display: none;
  }
  #menuOverlay.open {
    display: block;
  }
  .icon-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
  }
  .icon-choice {
    flex: 0 0 auto;
    width: calc(25% - 6px);
    background: #f9fafb;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 2px;
    font-size: 18px;
    text-align: center;
  }
  .icon-choice.active {
    border-color: var(--accent);
    background: #e4eefb;
  }
  .icon-choice.qopt {
    width: auto;
    flex: 1 1 auto;
    min-width: 70px;
    padding: 10px 8px;
  }
  select {
    width: 100%;
    background: #f9fafb;
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px;
    font-family: inherit;
    font-size: 14px;
    margin-top: 4px;
  }
  .marker-emoji-tooltip {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    font-size: 15px !important;
    padding: 0 !important;
    pointer-events: none;
  }
  .marker-emoji-tooltip::before {
    display: none !important;
  }
  .field-twin-badge {
    background: transparent !important;
    border: none !important;
  }

  /* ---- v11 skin: road sign legibility for outdoor use ---- */
  :root {
    --bg: #eef2f6;
    --panel: #ffffff;
    --line: #b8c2cc;
    --accent: #0b4ea2;
    --accent-dim: #0b4ea2;
    --text: #0a1b2e;

    --signal: #7fb0f0;

    --dock-h: 66px;

  html, body {
    font-family: 'Overpass', 'Segoe UI', Roboto, Arial, sans-serif;

  }

  }

  button {
    font-family: inherit;

  #actionBar { justify-content: flex-end; gap: 12px; }

  #updateBtn, #receiptDockBtn {

  #updateBtn { background: var(--accent); color: #ffffff; }

  #menuBtn, #infoBtn {
    min-height: 44px;
    width: 44px;
    padding: 0;

  #infoBtn { font-weight: 800; text-transform: none; }

  #searchPage { font-family: inherit; }
  #panel .panel-actions {
    position: sticky;

    background: var(--panel);

  }

  #panel {
    z-index: 1010;
    max-height: 72%;
    border-top: 2px solid var(--text);
    border-radius: 16px 16px 0 0;
    padding: 18px 16px 22px 16px;

  #panel h2 {
    font-family: inherit;

  }
  #panel h2::first-letter { text-transform: uppercase; }
  .meta-line {
    font-family: inherit;

    margin-bottom: 2px;
  }
  .question {
    margin: 16px 0 4px 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .question + div { font-size: 17px; }
  input[type=text], input[type=number], input[type=date], input[type=datetime-local], textarea, select,
  .sq-filters input, .sq-filters select {

  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }

  .panel-actions { margin-top: 18px; gap: 8px; flex-wrap: wrap; }

  .icon-choice {

  }
  .icon-choice.active { border-color: var(--accent); background: #e2edfb; }

  #sideMenu {
    left: -300px;
    right: auto;
    width: 280px;
    border-left: none;
    border-right: 2px solid var(--text);

    transition: left 0.2s ease;
  }
  #sideMenu.open { left: 0; right: auto; }
  #sideMenu h3 {
    font-size: 13px;
    font-weight: 600;

  .sq-head { border-bottom: 2px solid var(--text); }

  .sq-actions button { font-size: 13px; padding: 0 4px; }
  .sq-summary { font-family: inherit; font-size: 15px; font-weight: 800; color: var(--text); }
  .sq-name { font-size: 16px; font-weight: 600; }
  .sq-sub { font-size: 13px; }

<body>

<header>
  <button id="menuBtn">&#9776;</button>
  <div class="header-center">
    <div class="title">[ FIELD TWIN ]</div>
    <div class="status" id="statusLine">idle</div>
  </div>
  <button id="infoBtn">i</button>
</header>

<div id="actionBar">
  <div class="radar" id="radar">
    <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
  </div>
  <button id="updateBtn">LOG</button>
  <button id="receiptDockBtn">RECEIPT</button>
</div>

<div id="map"></div>
<input type="file" id="receiptFile" accept="image/*" capture="environment">

<div id="menuOverlay"></div>
<div id="sideMenu">

  <button class="secondary" id="receiptBtn">NEW RECEIPT</button>

  <button class="secondary" id="historyBtn">HISTORY</button>
  <button class="secondary" id="spendBtn">SPEND</button>
  <button class="secondary" id="profileBtn">PROFILE</button>

  <button class="secondary" id="exportBtn">EXPORT</button>
  <button class="secondary" id="importBtn">IMPORT</button>
  <input type="file" id="importInput" accept="application/json">

  <div id="legendRows"></div>
</div>

function signHtml(key, iconChar, size) {
  const meta = CATEGORIES[key] || CATEGORIES.general;
  const shape = SIGN_SHAPES[key] || 'shield';
  const ink = '#0a1b2e';
  let w = 34, h = 34, body = '', shift = 0, scale = 1;
  if (shape === 'octagon') body = '<polygon points="10,1.5 24,1.5 32.5,10 32.5,24 24,32.5 10,32.5 1.5,24 1.5,10"/>';
  else if (shape === 'square') body = '<rect x="2" y="2" width="30" height="30" rx="5"/>';
  else if (shape === 'diamond') { body = '<polygon points="17,1.5 32.5,17 17,32.5 1.5,17"/>'; scale = 0.82; }
  else if (shape === 'pentagon') { body = '<polygon points="17,1.5 32.5,13 32.5,32.5 1.5,32.5 1.5,13"/>'; shift = 3; }
  else if (shape === 'guide') { w = 42; body = '<rect x="1.5" y="5" width="39" height="24" rx="4"/>'; }
  else if (shape === 'yield') { body = '<polygon points="1.5,3 32.5,3 17,32.5"/>'; shift = -4; scale = 0.78; }
  else if (shape === 'circle') body = '<circle cx="17" cy="17" r="15.5"/>';
  else if (shape === 'tag') { w = 30; body = '<rect x="2" y="2" width="26" height="30" rx="3"/>'; }
  else { body = '<path d="M3,2 H31 V17 C31,26 17,32.5 17,32.5 C17,32.5 3,26 3,17 Z"/>'; shift = -2; scale = 0.9; }
  const k = (size || 34) / 34;
  const fs = Math.round(16 * scale * k);
  return '<div class="ft-sign" style="width:' + Math.round(w * k) + 'px;height:' + Math.round(h * k) + 'px;">' +
    '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + Math.round(w * k) + '" height="' + Math.round(h * k) + '" aria-hidden="true">' +
    '<g fill="#ffffff" stroke="none">' + body + '</g>' +
    '<g fill="' + meta.color + '" fill-opacity="0.2" stroke="' + ink + '" stroke-width="2" stroke-linejoin="round">' + body + '</g>' +
    '</svg>' +
    '<span style="font-size:' + fs + 'px;transform:translateY(' + Math.round(shift * k) + 'px);">' + iconChar + '</span></div>';
}

const PHOTO_DB = 'fieldTwinPhotos';
const PHOTO_STORE = 'photos';
let photoDbPromise = null;

function openPhotoDb() {
  if (photoDbPromise) return photoDbPromise;
  photoDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('no indexeddb')); return; }
    const req = indexedDB.open(PHOTO_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(PHOTO_STORE)) {
        db.createObjectStore(PHOTO_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return photoDbPromise;
}

function photoPut(id, dataUrl) {
  return openPhotoDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, 'readwrite');
    tx.objectStore(PHOTO_STORE).put(dataUrl, id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }));
}

function photoGet(id) {
  return openPhotoDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(PHOTO_STORE, 'readonly');
    const req = tx.objectStore(PHOTO_STORE).get(id);
    req.onsuccess = () => resolve(req.result || '');
    req.onerror = () => reject(req.error);
  }));
}

function photoDelete(id) {
  return openPhotoDb().then(db => new Promise((resolve) => {
    const tx = db.transaction(PHOTO_STORE, 'readwrite');
    tx.objectStore(PHOTO_STORE).delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => resolve(false);
  }));
}

function dataUrlToBlob(dataUrl) {
  const parts = dataUrl.split(',');
  const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function entryToRow(e, photoPath) {
  return {
    id: e.id,
    user_id: cloudUser.id,
    twin_id: e.twinId || TWIN_ID,
    ts: e.timestamp,
    lat: typeof e.lat === 'number' ? e.lat : null,
    lon: typeof e.lon === 'number' ? e.lon : null,
    address_label: e.addressLabel || '',
    category: e.category || null,
    form_type: e.formType || null,
    place_type: e.placeType || null,
    icon: e.icon || null,
    questions: (e.questions || []).map(q => (q && typeof q === 'object') ? q.text : q),
    answers: e.answers || [],
    context: e.context || '',
    loc_src: e.locSrc || null,
    photo_path: photoPath || e.photoPath || null
  };
}

function rowToEntry(r) {
  return {
    id: r.id,
    timestamp: r.ts,
    lat: r.lat,
    lon: r.lon,
    addressLabel: r.address_label || '',
    category: r.category,
    formType: r.form_type,
    placeType: r.place_type,
    icon: r.icon,
    questions: r.questions || [],
    answers: r.answers || [],
    context: r.context || '',
    locSrc: r.loc_src,
    twinId: r.twin_id,
    photoPath: r.photo_path,
    updatedAt: r.updated_at
  };
}

async function cloudPush() {
  if (!cloudReady() || syncing) return;
  syncing = true;
  const synced = getSyncedIds();
  const dirty = getDirtyIds();
  const pending = entries.filter(e => e.id && (!synced.has(e.id) || dirty.has(e.id)));
  let done = 0;
  try {
    for (const e of pending) {
      let photoPath = e.photoPath || null;
      if (e.photo && !photoPath) {
        const path = cloudUser.id + '/' + e.id + '.jpg';
        const up = await sb.storage.from('photos').upload(path, dataUrlToBlob(e.photo), {
          upsert: true, contentType: 'image/jpeg'
        });
        if (!up.error) {
          photoPath = path;
          e.photoPath = path;
        }
      }
      const er = await sb.from('entries').upsert(entryToRow(e, photoPath), { onConflict: 'id' });
      if (er.error) throw new Error(er.error.message);
      if (e.category === 'receipt' && e.receipt) {
        const rr = await sb.from('receipts').upsert({
          entry_id: e.id,
          user_id: cloudUser.id,
          store: e.receipt.store || '',
          total: e.receipt.total || 0,
          saved: e.receipt.saved || 0,
          tax: e.receipt.tax || 0,
          work: Boolean(e.receipt.work),
          receipt_date: (e.answers || [])[4] || null,
          receipt_time: (e.answers || [])[5] || null,
          raw: e.receipt
        }, { onConflict: 'entry_id' });
        if (rr.error) throw new Error(rr.error.message);
      }
      synced.add(e.id);
      setSyncedIds(synced);
      dirty.delete(e.id);
      setDirtyIds(dirty);
      done++;
    }
    if (pending.length) setStatus('synced ' + done + ' to cloud');
  } catch (err) {
    setStatus('sync paused, ' + err.message);
  } finally {
    syncing = false;
  }
}

async function cloudPull() {
  if (!cloudReady()) return;
  try {
    const res = await sb.from('entries').select('*').order('ts', { ascending: false });
    if (res.error) throw new Error(res.error.message);
    const rec = await sb.from('receipts').select('*');
    const receiptMap = {};
    (rec.data || []).forEach(r => { receiptMap[r.entry_id] = r; });
    const have = {};
    entries.forEach(e => { have[e.id] = e; });
    const synced = getSyncedIds();
    const dirtyNow = getDirtyIds();
    let added = 0;
    (res.data || []).forEach(r => {
      synced.add(r.id);
      const local = have[r.id];
      if (local) {
        if (dirtyNow.has(r.id)) return;
        if (!r.updated_at) return;
        if (local.updatedAt && new Date(r.updated_at) <= new Date(local.updatedAt)) return;
        const fresh = rowToEntry(r);
        const keepPhoto = local.photo;
        const keepCaptured = local.capturedAt;
        Object.assign(local, fresh);
        if (keepPhoto) local.photo = keepPhoto;
        if (keepCaptured) local.capturedAt = keepCaptured;
        const rcu = receiptMap[r.id];
        if (rcu) {
          local.receipt = {
            store: rcu.store || '',
            total: Number(rcu.total) || 0,
            saved: Number(rcu.saved) || 0,
            tax: Number(rcu.tax) || 0,
            work: Boolean(rcu.work),
            items: cleanItems(rcu.raw && rcu.raw.items)
          };
        }
        added++;
        return;
      }
      const e = rowToEntry(r);
      const rc = receiptMap[r.id];
      if (rc) {
        e.receipt = {
          store: rc.store || '',
          total: Number(rc.total) || 0,
          saved: Number(rc.saved) || 0,
          tax: Number(rc.tax) || 0,
          work: Boolean(rc.work),
          items: cleanItems(rc.raw && rc.raw.items)
        };
      }
      entries.push(e);
      added++;
    });
    setSyncedIds(synced);
    entries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    if (added) {
      await saveEntriesLocal();
      renderMarkers();
    }
    setStatus(entries.length + ' entries, cloud synced');
  } catch (err) {
    setStatus('cloud pull failed, ' + err.message);
  }
}

function pruneToRetention(list) {
  if (cloudUser) return list;
  const cutoff = Date.now() - RETENTION_MS;
  return list.filter(e => new Date(e.capturedAt || e.timestamp).getTime() >= cutoff);
}

async function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const stored = raw ? JSON.parse(raw) : [];
    const pruned = pruneToRetention(stored);
    entries = pruned;
    if (pruned.length !== stored.length) {
      const dropped = stored.filter(e => pruned.indexOf(e) === -1);
      dropped.forEach(e => { if (e.id) photoDelete(e.id); });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(pruned));
    }
    await Promise.all(entries.map(e => {
      if (!e.id || e.photo) return Promise.resolve();
      return photoGet(e.id).then(d => { if (d) e.photo = d; }).catch(() => {});
    }));
  } catch (e) {
    entries = [];
  }
}

async function saveEntries() {
  await saveEntriesLocal();
  cloudPush();
}

async function saveEntriesLocal() {
  const persisted = pruneToRetention(entries);
  await Promise.all(persisted.map(e => {
    if (!e.id || !e.photo) return Promise.resolve();
    return photoPut(e.id, e.photo).catch(() => {});
  }));
  const light = persisted.map(e => {
    const copy = Object.assign({}, e);
    delete copy.photo;
    return copy;
  });
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(light));
  } catch (e) {
    setStatus('storage write failed, entry kept in this session only');
  }
}

function initMap() {
  map = L.map('map', { zoomControl: true, preferCanvas: true }).setView([36.1, -113.9], 9);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'OpenStreetMap contributors',
    maxZoom: 19,
    crossOrigin: true
  }).addTo(map);
  if (L.markerClusterGroup) {
    markersLayer = L.markerClusterGroup({
      maxClusterRadius: 44,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: false,
      spiderfyOnMaxZoom: true,
      spiderfyDistanceMultiplier: 1.6,
      iconCreateFunction: function (cluster) {
        const n = cluster.getChildCount();
        const size = n < 10 ? 34 : (n < 50 ? 40 : 46);
        return L.divIcon({
          html: '<div class="ft-cluster" style="width:' + size + 'px;height:' + size + 'px;font-size:' + (n < 100 ? 15 : 13) + 'px;">' + n + '</div>',
          className: 'field-twin-badge',
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2]
        });
      }
    });
    markersLayer.on('clusterclick', (ev) => {
      if (pinPlacing) {
        finishPinPlacement(ev.originalEvent ? map.mouseEventToLatLng(ev.originalEvent) : ev.latlng);
      } else if (map.getZoom() >= map.getMaxZoom() - 1) {
        ev.layer.spiderfy();
      } else {
        ev.layer.zoomToBounds({ padding: [50, 50] });
      }
    });
    markersLayer.addTo(map);
  } else {
    markersLayer = L.layerGroup().addTo(map);
  }
  map.on('click', (ev) => { if (pinPlacing) finishPinPlacement(ev.latlng); });
  map.on('zoomend', () => { if (camerasVisible) renderCameras(); });
  setTimeout(() => map.invalidateSize(), 200);
  setTimeout(() => { map.invalidateSize(); renderMarkers(); }, 800);
}

function hasPos(e) {
  return typeof e.lat === 'number' && typeof e.lon === 'number' && isFinite(e.lat) && isFinite(e.lon);
}

function siteKey(e) {
  if (!hasPos(e)) return 'nopos';
  return e.lat.toFixed(3) + ',' + e.lon.toFixed(3);
}

function answeredCount(e) {
  if (e.context) return 3;
  if (!e.answers) return 0;
  return e.answers.filter(a => a && String(a).trim() !== '').length;
}

function scoreEntries(list) {
  const seenSites = {};
  const siteFields = {};
  const categoryCounts = {};
  let total = 0;
  let firstVisits = 0;
  let photos = 0;

  const chrono = list.slice().sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

  chrono.forEach(e => {
    const key = siteKey(e);
    const cat = e.category || 'general';
    const fields = answeredCount(e);

    let points = 5 + fields * 3;
    if (e.photo) { points += 15; photos++; }
    if (!seenSites[key]) {
      points += 40;
      seenSites[key] = true;
      firstVisits++;
    } else {
      points = Math.round(points * 0.5);
    }
    if (['airstrip', 'memorial', 'airport', 'govt_building'].indexOf(cat) !== -1) {
      points = Math.round(points * 1.5);
    }

    total += points;
    siteFields[key] = (siteFields[key] || 0) + fields;
    categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
  });

  const siteCount = Object.keys(seenSites).length;
  const completedSites = Object.keys(siteFields).filter(k => siteFields[k] >= 24).length;
  total += completedSites * 60;

  return { total, entryCount: list.length, siteCount, firstVisits, photos, completedSites, categoryCounts, siteFields };
}

function territorySpan(list) {
  list = list.filter(hasPos);
  if (!list.length) return 0;
  let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
  list.forEach(e => {
    minLat = Math.min(minLat, e.lat); maxLat = Math.max(maxLat, e.lat);
    minLon = Math.min(minLon, e.lon); maxLon = Math.max(maxLon, e.lon);
  });
  const latMiles = (maxLat - minLat) * 69;
  const lonMiles = (maxLon - minLon) * 55;
  return Math.round(Math.sqrt(latMiles * latMiles + lonMiles * lonMiles));
}

function computeTrophies(stats, list) {
  const catKeys = Object.keys(CATEGORIES).filter(k => k !== 'none');
  const distinctCats = catKeys.filter(k => stats.categoryCounts[k]).length;
  const span = territorySpan(list);
  return [
    { name: 'First contact', desc: 'Log your first stop', earned: stats.entryCount >= 1 },
    { name: 'Ten down', desc: 'Log ten stops', earned: stats.entryCount >= 10 },
    { name: 'Century', desc: 'Log one hundred stops', earned: stats.entryCount >= 100 },
    { name: 'Documentarian', desc: 'Attach ten photos', earned: stats.photos >= 10 },
    { name: 'Thorough', desc: 'Fully document five sites', earned: stats.completedSites >= 5 },
    { name: 'Scout', desc: 'Reach twenty five distinct sites', earned: stats.siteCount >= 25 },
    { name: 'Cartographer', desc: 'Cover fifty miles of ground', earned: span >= 50 },
    { name: 'Range rider', desc: 'Cover two hundred miles of ground', earned: span >= 200 },
    { name: 'Bush pilot', desc: 'Document three airstrips', earned: (stats.categoryCounts.airstrip || 0) >= 3 },
    { name: 'Keeper', desc: 'Record five roadside memorials', earned: (stats.categoryCounts.memorial || 0) >= 5 },
    { name: 'Civic duty', desc: 'Document five government buildings', earned: (stats.categoryCounts.govt_building || 0) >= 5 },
    { name: 'Full spectrum', desc: 'Log every category at least once', earned: distinctCats >= catKeys.length }
  ];
}

function cleanItems(list) {
  if (!Array.isArray(list)) return [];
  return list
    .map(it => ({
      name: String((it && it.name) || '').trim(),
      price: (it && it.price !== null && it.price !== undefined && isFinite(Number(it.price))) ? Number(it.price) : null
    }))
    .filter(it => it.name);
}

function itemsToText(items) {
  return cleanItems(items).map(it => it.name + (it.price !== null ? ' | ' + it.price.toFixed(2) : '')).join('\n');
}

function textToItems(text) {
  return String(text || '').split('\n').map(line => {
    const t = line.trim();
    if (!t) return null;
    const m = t.match(/^(.*?)\s*\|\s*\$?(-?\d+(?:\.\d+)?)\s*$/);
    if (m && m[1].trim()) return { name: m[1].trim(), price: parseFloat(m[2]) };
    return { name: t.replace(/\s*\|\s*$/, ''), price: null };
  }).filter(Boolean);
}

async function entryPhotoData(entry) {
  if (entry.photo) return entry.photo;
  if (!entry.photoPath) return '';
  const url = await cloudPhotoUrl(entry.photoPath);
  if (!url) return '';
  const blob = await (await fetch(url)).blob();
  return await new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}

function entryText(e) {
  const m = CATEGORIES[e.category || 'general'] || CATEGORIES.general;
  const parts = [e.addressLabel || '', e.context || '', m.label];
  (e.answers || []).forEach(a => { if (a) parts.push(String(a)); });
  if (e.receipt && e.receipt.items) e.receipt.items.forEach(it => { parts.push(it.name); });
  return parts.join(' ').toLowerCase();
}

function localDay(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function runSearch() {
  const val = id => (document.getElementById(id).value || '').trim();
  const words = val('sqText').toLowerCase().split(/\s+/).filter(Boolean);
  const from = val('sqFrom');
  const to = val('sqTo');
  const cat = val('sqCat');
  const work = val('sqWork');
  const photo = val('sqPhoto');
  const min = val('sqMin') === '' ? null : parseFloat(val('sqMin'));
  const max = val('sqMax') === '' ? null : parseFloat(val('sqMax'));
  const sort = val('sqSort');

  let list = entries.filter(e => {
    if (cat && (e.category || 'general') !== cat) return false;
    const day = localDay(e.timestamp);
    if (from && day < from) return false;
    if (to && day > to) return false;
    if (work) {
      if (!e.receipt) return false;
      if (work === 'work' && !e.receipt.work) return false;
      if (work === 'personal' && e.receipt.work) return false;
    }
    if (photo === 'yes' && !(e.photo || e.photoPath)) return false;
    if (photo === 'no' && (e.photo || e.photoPath)) return false;
    if (min !== null || max !== null) {
      if (!e.receipt) return false;
      if (min !== null && e.receipt.total < min) return false;
      if (max !== null && e.receipt.total > max) return false;
    }
    if (words.length) {
      const hay = entryText(e);
      for (let i = 0; i < words.length; i++) {
        if (hay.indexOf(words[i]) === -1) return false;
      }
    }
    return true;
  });

  const total = e => (e.receipt ? e.receipt.total : 0);
  if (sort === 'old') list.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  else if (sort === 'high') list.sort((a, b) => total(b) - total(a));
  else if (sort === 'low') list.sort((a, b) => total(a) - total(b));
  else if (sort === 'name') list.sort((a, b) => (a.addressLabel || '').localeCompare(b.addressLabel || ''));
  else list.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  searchResults = list;
  let spent = 0, saved = 0, receipts = 0;
  list.forEach(e => { if (e.receipt) { spent += e.receipt.total; saved += e.receipt.saved; receipts++; } });
  document.getElementById('sqSummary').textContent =
    list.length + ' found' + (receipts ? ', ' + receipts + ' receipts, $' + spent.toFixed(2) + ' spent, $' + saved.toFixed(2) + ' saved' : '');

  const box = document.getElementById('sqRows');
  if (!list.length) {
    box.innerHTML = '<div class="sq-empty">Nothing matches these filters</div>';
    return;
  }
  let html = '';
  list.forEach((e, i) => {
    const m = CATEGORIES[e.category || 'general'] || CATEGORIES.general;
    const d = new Date(e.timestamp);
    html += '<div class="sq-row" data-i="' + i + '">';
    html += '<div class="sq-sign">' + signHtml(e.formType === 'none' ? 'none' : (e.category || 'general'), e.icon || m.icon, 34) + '</div>';
    html += '<div class="sq-main">';
    html += '<div class="sq-name">' + escapeHtml(e.addressLabel || m.label) + '</div>';
    html += '<div class="sq-sub">' + d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) +
            ', ' + m.label + (e.receipt ? (e.receipt.work ? ', work' : ', personal') : '') +
            (e.receipt && e.receipt.items && e.receipt.items.length ? ', ' + e.receipt.items.length + ' items' : '') +
            (hasPos(e) ? '' : ', no pin') + '</div>';
    html += '</div>';
    html += '<div class="sq-amt">' + (e.receipt ? '$' + e.receipt.total.toFixed(2) : '') + '</div>';
    html += '</div>';
  });
  box.innerHTML = html;
  box.querySelectorAll('.sq-row').forEach(el => {
    el.addEventListener('click', () => {
      const e = searchResults[parseInt(el.getAttribute('data-i'), 10)];
      document.getElementById('searchPage').classList.remove('open');
      if (hasPos(e)) map.setView([e.lat, e.lon], 15);
      showEntry(e, 'search');
    });
  });
}

function csvCell(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportSearchCsv() {
  const head = ['date', 'time', 'name', 'type', 'store', 'total', 'saved', 'tax', 'work or personal', 'address on receipt', 'latitude', 'longitude', 'notes', 'context', 'items'];
  const lines = [head.map(csvCell).join(',')];
  searchResults.forEach(e => {
    const m = CATEGORIES[e.category || 'general'] || CATEGORIES.general;
    const d = new Date(e.timestamp);
    const qs = (e.questions || []).map(q => (q && typeof q === 'object') ? q.text : q);
    const ans = name => { const i = qs.indexOf(name); return i >= 0 ? ((e.answers || [])[i] || '') : ''; };
    lines.push([
      localDay(e.timestamp),
      d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }),
      e.addressLabel || '',
      m.label,
      e.receipt ? e.receipt.store : '',
      e.receipt ? e.receipt.total.toFixed(2) : '',
      e.receipt ? e.receipt.saved.toFixed(2) : '',
      e.receipt ? e.receipt.tax.toFixed(2) : '',
      e.receipt ? (e.receipt.work ? 'work' : 'personal') : '',
      ans('Address on receipt'),
      hasPos(e) ? e.lat : '',
      hasPos(e) ? e.lon : '',
      ans('Notes'),
      e.context || '',
      (e.receipt && e.receipt.items) ? e.receipt.items.map(it => it.name + (it.price !== null && it.price !== undefined ? ' ' + Number(it.price).toFixed(2) : '')).join('; ') : ''
    ].map(csvCell).join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'field-twin-search-' + localDay(new Date()) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function renderMarkers() {
  if (!map || !markersLayer) return;
  markersLayer.clearLayers();
  let renderError = null;
  let drawn = 0;
  entries.forEach(e => {
    if (!hasPos(e)) return;
    if (mapFilterIds && !mapFilterIds.has(e.id)) return;
    const lat = e.lat;
    const lon = e.lon;
    try {
      const key = e.formType === 'none' ? 'none' : (e.category || 'general');
      const meta = CATEGORIES[key] || CATEGORIES.general;
      const fill = meta.color;
      const iconChar = e.icon || meta.icon;

      let pinIcon;
      if (key === 'receipt') {
        const amt = e.receipt && e.receipt.total ? '$' + Math.round(e.receipt.total) : '$';
        pinIcon = L.divIcon({
          html: '<div class="ft-price">' + amt + '</div>',
          className: 'field-twin-badge',
          iconSize: [0, 0],
          iconAnchor: [0, 0]
        });
      } else {
        pinIcon = L.divIcon({
          html: '<div class="ft-signwrap">' + signHtml(key, iconChar, 34) + '</div>',
          className: 'field-twin-badge',
          iconSize: [0, 0],
          iconAnchor: [0, 0]
        });
      }
      const pin = L.marker([lat, lon], { icon: pinIcon, interactive: true });
      pin.on('click', (ev) => { if (pinPlacing) finishPinPlacement(ev.originalEvent ? map.mouseEventToLatLng(ev.originalEvent) : ev.latlng); else showEntry(e); });
      pin.addTo(markersLayer);

      drawn++;
    } catch (err) {
      renderError = err.message;
    }
  });
  setTimeout(() => map.invalidateSize(), 50);
  if (renderError) {
    setStatus('marker render error: ' + renderError);
  }
}

function timeOfDay(date) {
  const h = date.getHours();
  if (h >= 22 || h < 6) return 'late';
  if (h >= 6 && h < 18) return 'work';
  return 'evening';
}

function detectCategory(geo) {
  const type = (geo.type || '').toLowerCase();
  const name = (geo.name || geo.display_name || '').toLowerCase();
  const addr = geo.address || {};
  const shop = (addr.shop || '').toLowerCase();
  const amenity = (addr.amenity || '').toLowerCase();
  const tourism = (addr.tourism || '').toLowerCase();
  const office = (addr.office || '').toLowerCase();
  const all = [type, shop, amenity, tourism, office];
  const has = (v) => all.indexOf(v) !== -1;

  if (has('parcel_locker') || name.includes('amazon hub') || name.includes('amazon locker')) return 'amazon_locker';
  if (has('fuel')) return 'gas_station';
  if (has('cafe') || has('coffee')) return 'coffee_shop';
  if (has('cannabis') || name.includes('dispensary')) return 'dispensary';
  if (has('pharmacy') || has('chemist')) return 'pharmacy';
  if (has('bank') || has('atm')) return 'bank';
  if (has('car_wash')) return 'car_wash';
  if (has('laundry') || has('dry_cleaning') || name.includes('laundromat')) return 'laundromat';
  if (has('fast_food')) return 'fast_food';
  if (has('restaurant') || has('food_court')) return 'restaurant';
  if (has('supermarket') || has('grocery') || has('convenience')) return 'grocery';
  if (has('hotel') || has('motel') || has('lodging') || has('guest_house')) return 'hotel';
  if (has('warehouse') || has('industrial') || has('distribution')) return 'warehouse';
  if (has('copyshop') || name.includes('print')) return 'printer_site';
  if (has('aerodrome') || has('airport') || name.includes('airport')) {
    return (name.includes('airstrip') || name.includes('airfield') || name.includes('landing')) ? 'airstrip' : 'airport';
  }
  if (has('runway') || has('airstrip') || name.includes('airstrip') || name.includes('airfield')) return 'airstrip';
  if (has('mall') || has('shopping_centre') || has('shopping_center') || name.includes('mall')) return 'mall';
  if (has('police') || has('fire_station') || has('library') || has('courthouse') ||
      has('townhall') || has('post_office') || has('government') || has('public_building') ||
      has('social_facility') || has('prison') || has('ranger_station')) return 'govt_building';
  if (shop || has('department_store') || has('marketplace')) return 'retail';
  return null;
}

function classify(geo, hasMilitary, tod) {
  const tags = geo.address || {};
  const isCommercial = !!(tags.shop || tags.amenity || tags.office || tags.industrial);
  const isLodging = !!(tags.tourism === 'hotel' || tags.building === 'hotel' || tags.amenity === 'lodging');

  if (tod === 'late' && isLodging) {
    return { placeType: 'lodging', confidence: 3, formType: 'none', questions: [], category: null };
  }
  if (hasMilitary) {
    return {
      placeType: 'restricted proximity',
      confidence: 1,
      formType: 'full',
      questions: fullQuestions(),
      category: null
    };
  }

  const category = detectCategory(geo);
  if (category) {
    return {
      placeType: categoryLabel(category),
      confidence: 5,
      formType: 'category',
      questions: categoryQuestions(category),
      category: category
    };
  }

  if (isCommercial && tod === 'work') {
    return {
      placeType: 'commercial, work hours',
      confidence: 4,
      formType: 'short',
      questions: shortQuestions(),
      category: null
    };
  }
  if (isLodging && tod === 'work') {
    return {
      placeType: 'lodging, work hours',
      confidence: 3,
      formType: 'short',
      questions: shortQuestions(),
      category: null
    };
  }
  return {
    placeType: 'ambiguous',
    confidence: 2,
    formType: 'full',
    questions: fullQuestions(),
    category: null
  };
}

function categoryLabel(category) {
  return CATEGORIES[category] ? CATEGORIES[category].label : category;

function pickSubset(pool, n) {
  const copy = pool.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, Math.min(n, copy.length));
}

async function reverseGeocode(lat, lon) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&namedetails=1`;
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error('reverse geocode failed');
  const data = await res.json();
  return data || {};
}

async function checkMilitary(lat, lon) {
  const query = `[out:json][timeout:15];(way(around:400,${lat},${lon})[landuse=military];relation(around:400,${lat},${lon})[landuse=military];);out count;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: query
    });
    if (!res.ok) return false;
    const data = await res.json();
    const count = data.elements && data.elements[0] && data.elements[0].tags
      ? parseInt(data.elements[0].tags.total || '0', 10)
      : 0;
    return count > 0;
  } catch (e) {
    return false;
  }
}

function getPosition() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 15000
    });
  });
}

async function forceUpdate() {
  const btn = document.getElementById('updateBtn');
  btn.disabled = true;
  try {
    setStatus('acquiring position');
    setRadar(1);
    const pos = await getPosition();
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    setStatus('resolving address');
    setRadar(3);
    const geo = await reverseGeocode(lat, lon).catch(() => ({}));

    setStatus('checking proximity');
    setRadar(5);
    const hasMilitary = await checkMilitary(lat, lon);

    const now = new Date();
    const tod = timeOfDay(now);
    const cls = classify(geo, hasMilitary, tod);

    setRadar(8);
    setStatus('stop identified');

    const entry = {
      id: now.getTime() + '-' + Math.random().toString(36).slice(2, 8),
      timestamp: now.toISOString(),
      lat, lon,
      addressLabel: formatAddress(geo.address || {}),
      placeType: cls.placeType,
      confidence: cls.confidence,
      formType: cls.formType,
      category: cls.category,
      questions: cls.questions,
      answers: [],
      context: '',
      icon: (CATEGORIES[cls.category] || CATEGORIES.general).icon,
      twinId: TWIN_ID
    };

    if (cls.formType === 'none') {
      entries.unshift(entry);
      await saveEntries();
      renderMarkers();
      map.setView([lat, lon], 14);
      setRadar(0);
    } else {
      pendingEntry = entry;
      showForm(entry);
      map.setView([lat, lon], 14);
    }
  } catch (err) {
    setStatus('update failed, ' + (err.message || 'unknown error'));
    setRadar(0);
  } finally {
    btn.disabled = false;
  }
}

function formatAddress(address) {
  const parts = [address.road, address.neighbourhood, address.suburb, address.city, address.town, address.village];
  return parts.filter(Boolean).join(', ') || 'unresolved address';
}

function showForm(entry) {
  const questionObjs = entry.questions;
  const formAnswers = {};
  selectedIcon = (CATEGORIES[entry.category] || CATEGORIES.general).icon;
  const panel = document.getElementById('panel');
  const label = entry.category ? entry.category.toUpperCase().replace('_', ' ') : 'LOG ENTRY';
  let html = '<h2>' + label + '</h2>';
  html += '<div class="meta-line">' + entry.addressLabel + '</div>';
  html += '<div class="question">Stop type, changes the form below</div>';
  html += '<div class="icon-picker" id="iconPicker">';
  ICON_CHOICES.forEach((key) => {
    const meta = CATEGORIES[key];
    const active = (entry.category || 'general') === key ? ' active' : '';
    html += '<div class="icon-choice' + active + '" data-catkey="' + key + '">';
    html += '<div style="font-size:20px;line-height:24px;">' + meta.icon + '</div>';
    html += '<div style="font-size:10px;line-height:13px;">' + meta.label + '</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="question">Photo, optional</div>';
  html += '<input type="file" id="photoInput" accept="image/*" capture="environment" style="width:100%;font-size:13px;">';
  html += '<div id="photoPreview"></div>';
  html += '<div class="question">Context, optional, overrides the questions below</div>';
  html += '<textarea id="contextInput" placeholder="a single line here can replace the full form"></textarea>';
  questionObjs.forEach((q) => {

      });

    }
  });

  html += '<button id="saveEntryBtn">SAVE ENTRY</button>';
  html += '<button class="secondary" id="skipEntryBtn">LOG WITHOUT ANSWERS</button>';
  html += '</div>';
  panel.innerHTML = html;
  panel.scrollTop = 0;
  panel.classList.add('open');

  let photoData = entry.photo || '';
  const photoInput = document.getElementById('photoInput');
  const photoPreview = document.getElementById('photoPreview');
  if (photoData) {
    photoPreview.innerHTML = '<img src="' + photoData + '" style="max-width:100%;margin-top:6px;">';
  }
  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 900;
        let w = img.width;
        let h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        photoData = canvas.toDataURL('image/jpeg', 0.7);
        photoPreview.innerHTML = '<img src="' + photoData + '" style="max-width:100%;margin-top:6px;">';
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('iconPicker').querySelectorAll('.icon-choice').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.getAttribute('data-catkey');
      if ((entry.category || 'general') === key) return;
      entry.photo = photoData;
      entry.category = key === 'general' ? null : key;
      entry.icon = CATEGORIES[key].icon;
      entry.formType = key === 'general' ? 'full' : 'category';
      entry.questions = key === 'general' ? fullQuestions() : categoryQuestions(key);
      showForm(entry);
    });
  });

  panel.querySelectorAll('.qopt').forEach(el => {
    el.addEventListener('click', () => {
      const qid = el.getAttribute('data-qid');
      panel.querySelectorAll('.qopt[data-qid="' + qid + '"]').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      formAnswers[qid] = el.getAttribute('data-value');
    });
  });

  panel.querySelectorAll('select[data-qid]').forEach(el => {
    el.addEventListener('change', () => {
      formAnswers[el.getAttribute('data-qid')] = el.value;
    });
  });

  panel.querySelectorAll('input[data-qid]').forEach(el => {
    el.addEventListener('input', () => {
      formAnswers[el.getAttribute('data-qid')] = el.value.trim();
    });
  });

  function finalizeEntry(withAnswers) {
    const context = document.getElementById('contextInput').value.trim();
    entry.context = context;
    if (context) {
      entry.answers = [];
      entry.questions = questionObjs.map(q => q.text);
    } else if (withAnswers) {
      entry.answers = questionObjs.map(q => formAnswers[q.id] || '');
      entry.questions = questionObjs.map(q => q.text);
    } else {
      entry.answers = [];
      entry.questions = questionObjs.map(q => q.text);
    }
    entry.icon = selectedIcon;
    entry.photo = photoData;
  }

  function entrySignature(e) {
    return e.lat.toFixed(4) + '|' + e.lon.toFixed(4) + '|' + e.context + '|' + e.answers.join('~');
  }

  function commitEntry(saveBtn, skipBtn, statusMessage) {
    const signature = entrySignature(entry);
    const now = Date.now();
    if (now - lastSaveTime < MIN_SAVE_INTERVAL_MS && signature === lastSaveSignature) {
      setStatus('duplicate ignored, same info at this spot within the last 30 seconds');
      closePanel();
      return;
    }
    lastSaveTime = now;
    lastSaveSignature = signature;
    const beforeScore = scoreEntries(entries).total;
    entries.unshift(entry);
    saveEntries().catch(() => {}).then(() => {
      renderMarkers();
      map.setView([entry.lat, entry.lon], 15);
      setRadar(0);
      const after = scoreEntries(entries).total;
      const gained = after - beforeScore;
      setStatus('saved, plus ' + gained + ' points, ' + after + ' total');
      setTimeout(closePanel, 500);
    });
  }

  document.getElementById('saveEntryBtn').addEventListener('click', function () {
    const saveBtn = this;
    const skipBtn = document.getElementById('skipEntryBtn');
    if (saveBtn.disabled) return;
    saveBtn.disabled = true;
    skipBtn.disabled = true;
    saveBtn.textContent = 'SAVED';
    finalizeEntry(true);
    commitEntry(saveBtn, skipBtn, 'entry saved');
  });

  document.getElementById('skipEntryBtn').addEventListener('click', function () {
    const skipBtn = this;
    const saveBtn = document.getElementById('saveEntryBtn');
    if (skipBtn.disabled) return;
    skipBtn.disabled = true;
    saveBtn.disabled = true;
    skipBtn.textContent = 'LOGGED';
    finalizeEntry(false);
    commitEntry(saveBtn, skipBtn, 'entry logged without answers');
  });
}

const API_BASE_KEY = 'apiBase';
const CAM_CACHE = 'ndotCameras';
let cameraLayer = null;
let cameras = [];

function getApiToken() {
  try { return localStorage.getItem('apiToken') || ''; } catch (e) { return ''; }
}

function setApiToken(v) {
  try { localStorage.setItem('apiToken', v); } catch (e) {}
}

function getApiBase() {
  try { return localStorage.getItem(API_BASE_KEY) || ''; } catch (e) { return ''; }
}

function setApiBase(v) {
  try { localStorage.setItem(API_BASE_KEY, v); } catch (e) {}
}

function milesBetween(lat1, lon1, lat2, lon2) {
  const dLat = (lat2 - lat1) * 69;
  const dLon = (lon2 - lon1) * 55;
  return Math.sqrt(dLat * dLat + dLon * dLon);
}

async function loadCameras(force) {
  const base = getApiBase();
  if (!base) { setStatus('no api address set, add one in the menu'); return false; }
  if (!force) {
    try {
      const cached = localStorage.getItem(CAM_CACHE);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (Date.now() - parsed.at < 7 * 24 * 60 * 60 * 1000) {
          cameras = parsed.list;
          return true;
        }
      }
    } catch (e) {}
  }
  setStatus('loading cameras');
  try {
    const root = base.replace(/\/+$/, '');
    const res = await fetch(root + '/cameras');
    if (!res.ok) throw new Error('http ' + res.status);
    const payload = await res.json();
    const list = payload.cameras || [];
    cameras = list.filter(c => isFinite(c.lat) && isFinite(c.lon));
    try {
      localStorage.setItem(CAM_CACHE, JSON.stringify({ at: Date.now(), list: cameras }));
    } catch (e) {}
    setStatus(cameras.length + ' cameras loaded');
    return true;
  } catch (e) {
    setStatus('camera load failed, service unreachable at ' + getApiBase().replace(/^https?:\/\//, ''));
    return false;
  }
}

function renderCameras() {

              (showLabels ? '<div style="position:absolute;top:32px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;background:rgba(255,255,255,0.9);padding:1px 4px;border-radius:3px;color:#14202e;">' + escapeHtml(c.roadway || '') + '</div>' : ''),
        className: 'field-twin-badge',

      }),

  });

function playStream(video, url) {
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.play().catch(() => {});
    return;
  }
  if (window.Hls && window.Hls.isSupported()) {
    const hls = new window.Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    return;
  }
  video.src = url;
  video.play().catch(() => {});
}

function shrinkDataUrl(dataUrl, maxDim, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function extractWithVision(photoData) {

  const tok = getApiToken();
  if (tok) headers['Authorization'] = 'Bearer ' + tok;
  const small = await shrinkDataUrl(photoData, 1100, 0.6);
  const res = await fetch(root + '/receipts/extract', {
    method: 'POST',
    headers: headers,
    body: JSON.stringify({ image: small })
  });
  if (!res.ok) throw new Error('service returned ' + res.status);
  const data = await res.json();
  return data.receipt || {};
}

function visionToFields(r) {
  const n = v => (v === null || v === undefined || v === '') ? '' : String(v);
  const addrParts = [r.address, r.city, r.state].filter(Boolean).join(', ');
  const out = {
    store: n(r.store),
    city: n(r.city),
    state: n(r.state),
    addr: addrParts,
    date: n(r.date),
    time: n(r.time),
    total: r.total !== null && r.total !== undefined ? Number(r.total).toFixed(2) : '',
    tax: r.tax !== null && r.tax !== undefined ? Number(r.tax).toFixed(2) : '',
    saved: r.saved !== null && r.saved !== undefined && Number(r.saved) > 0 ? Number(r.saved).toFixed(2) : '',
    conf: {}
  };
  ['store', 'addr', 'date', 'time', 'total', 'tax', 'saved'].forEach(k => {
    out.conf[k] = out[k] ? 'ok' : 'low';
  });
  out.items = cleanItems(r.items);
  if (r.fuel && (r.fuel.gallons || r.fuel.price_per_gallon)) {
    out.fuelNote = [
      r.fuel.gallons ? r.fuel.gallons + ' gal' : '',
      r.fuel.price_per_gallon ? 'at $' + r.fuel.price_per_gallon + ' per gal' : '',
      r.fuel.pump ? 'pump ' + r.fuel.pump : ''
    ].filter(Boolean).join(', ');
  }
  return out;
}

function cleanAddress(a) {
  return String(a || '')
    .replace(/\b(suite|ste|unit|apt|apartment|bldg|building|space|spc|room|rm|lot)\b\.?\s*#?\s*[\w-]*/gi, ' ')
    .replace(/#\s*[\w-]+/g, ' ')
    .replace(/\s+,/g, ',')
    .replace(/,\s*,+/g, ',')
    .replace(/\s{2,}/g, ' ')
    .replace(/^[\s,]+|[\s,]+$/g, '');
}

async function geocodeQuery(q, state) {
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&addressdetails=1' +
    (state ? '&countrycodes=us' : '') + '&q=' + encodeURIComponent(q);
  const res = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error('geocode failed');
  return await res.json();
}

async function geocodeSmart(raw) {
  const clean = cleanAddress(raw);
  if (!clean) throw new Error('address not found');
  const parts = clean.split(',').map(x => x.trim()).filter(Boolean);
  let state = '', city = '';
  const last = parts[parts.length - 1] || '';
  const sm = last.match(/^([A-Za-z]{2})(\s+\d{5}(-\d{4})?)?$/);
  if (sm && parts.length >= 2) {
    state = sm[1].toUpperCase();
    if (parts.length >= 3) city = parts[parts.length - 2];
  }
  const tries = [clean];
  const street = parts[0] || '';
  const streetNoNumber = street.replace(/^\d+[A-Za-z]?\s+/, '');
  if (city && streetNoNumber && streetNoNumber !== street) {
    tries.push([streetNoNumber, city, state].filter(Boolean).join(', '));
  }
  const inState = r => !state || !r.address || !r.address['ISO3166-2-lvl4'] || r.address['ISO3166-2-lvl4'] === 'US-' + state;
  const inCity = r => !city || String(r.display_name || '').toLowerCase().indexOf(city.toLowerCase()) !== -1;
  let weak = null;
  for (let i = 0; i < tries.length; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, 1200));
    let list = [];
    try { list = await geocodeQuery(tries[i], state); } catch (e) { list = []; }
    const good = list.filter(r => inState(r) && inCity(r))[0];
    if (good) {
      return { lat: parseFloat(good.lat), lon: parseFloat(good.lon), label: good.display_name, exact: i === 0 };
    }
    if (!weak) {
      const w = list.filter(inState)[0];
      if (w && !city) weak = { lat: parseFloat(w.lat), lon: parseFloat(w.lon), label: w.display_name, exact: false };
    }
  }
  if (weak) return weak;
  throw new Error('address not found');
}

function parseReceipt(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const out = { store: '', addr: '', date: '', time: '', total: '', tax: '', saved: '', conf: {} };

  const addrRe = /\d{2,6}\s+\w.+?(st|street|ave|avenue|rd|road|blvd|dr|drive|ln|lane|way|hwy|highway)\b/i;
  let addrIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    if (addrRe.test(lines[i])) { out.addr = lines[i]; addrIdx = i; break; }
  }
  const head = lines.slice(0, addrIdx > 0 ? addrIdx : 3);
  out.store = (head.filter(l => /[a-z]/i.test(l) && l.length > 2)[0] || '').replace(/[^\w\s&'.-]/g, '').trim();
  out.conf.store = out.store ? 'ok' : 'low';
  out.conf.addr = out.addr ? 'ok' : 'low';

  const dm = text.match(/(\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4})/);
  out.date = dm ? dm[1] : '';
  out.conf.date = dm ? 'ok' : 'low';

  const tm = text.match(/(\d{1,2}:\d{2}\s*(am|pm)?)/i);
  out.time = tm ? tm[1] : '';
  out.conf.time = tm ? 'ok' : 'low';

  const totalRe = /(total|balance due|amount due|amount)\D{0,10}(\d+\.\d{2})/ig;
  let m, last = null;
  while ((m = totalRe.exec(text)) !== null) {
    if (/sub\s*total/i.test(m[0])) continue;
    last = m[2];
  }
  out.total = last || '';
  out.conf.total = last ? 'ok' : 'low';

  const tax = text.match(/tax\D{0,10}(\d+\.\d{2})/i);
  out.tax = tax ? tax[1] : '';
  out.conf.tax = tax ? 'ok' : 'low';

  const savedRe = /(you saved|total savings|club savings|member savings|card savings|savings)\D{0,10}(\d+\.\d{2})/ig;
  let sum = 0, hit = false;
  while ((m = savedRe.exec(text)) !== null) { sum += parseFloat(m[2]); hit = true; }
  out.saved = hit ? sum.toFixed(2) : '';
  out.conf.saved = hit ? 'ok' : 'low';

  return out;
}

function receiptWhen(dateStr, timeStr, fallback) {
  const d = (dateStr || '').trim();
  const t = (timeStr || '').trim();
  let y, mo, da;
  let m = d.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
  if (m) { y = +m[1]; mo = +m[2]; da = +m[3]; }
  else {
    m = d.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);
    if (m) { mo = +m[1]; da = +m[2]; y = +m[3]; if (y < 100) y += 2000; }
  }
  if (!y || mo < 1 || mo > 12 || da < 1 || da > 31) return fallback;
  let hh = 12, mm = 0;
  const tm = t.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(am|pm)?$/i);
  if (tm) {
    hh = +tm[1]; mm = +tm[2];
    const ap = (tm[3] || '').toLowerCase();
    if (ap === 'pm' && hh < 12) hh += 12;
    if (ap === 'am' && hh === 12) hh = 0;
  }
  const out = new Date(y, mo - 1, da, hh, mm, 0);
  if (isNaN(out.getTime()) || out.getTime() > Date.now() + 86400000) return fallback;
  return out;
}

function classifyWork(when) {
  const day = when.getDay();
  const hr = when.getHours();
  if (day >= 1 && day <= 5 && hr >= 8 && hr < 17) {
    return { work: true, reason: 'weekday work hours' };
  }
  return { work: false, reason: 'outside work hours' };
}

function prepForOcr(dataUrl, maxDim) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        d[i] = d[i + 1] = d[i + 2] = g;
        sum += g;
      }
      const mean = sum / (d.length / 4);
      const cut = mean * 0.88;
      for (let i = 0; i < d.length; i += 4) {
        const val = d[i] > cut ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = val;
      }
      ctx.putImageData(imgData, 0, 0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

function shrinkImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function startReceipt(file) {
  setStatus('reading receipt');
  let photoData = '';
  try {
    photoData = await shrinkImage(file, 1600, 0.85);
  } catch (e) {
    setStatus('could not read photo');
    return;
  }

  let parsed = null;
  let fallbackReason = '';
  try {
    setStatus('reading receipt');
    const r = await extractWithVision(photoData);
    parsed = visionToFields(r);
    setStatus('receipt read');
  } catch (e) {
    fallbackReason = e.message;
    setStatus('using offline reader, ' + e.message);
    let text = '';
    try {
      const ocrImage = await prepForOcr(photoData, 2000);
      const res = await Tesseract.recognize(ocrImage, 'eng', {
        logger: m => {
          if (m.status === 'recognizing text') {
            setStatus('offline reader, ' + Math.round(m.progress * 100) + ' percent');
          }
        }
      });
      text = res.data.text || '';
    } catch (e2) {
      setStatus('could not read text, enter details by hand');
    }
    parsed = parseReceipt(text);
    parsed.fallbackReason = fallbackReason;
  }
  let lat = null, lon = null, addressLabel = 'location not captured';
  try {
    const pos = await getPosition();
    lat = pos.coords.latitude;
    lon = pos.coords.longitude;
    const geo = await reverseGeocode(lat, lon).catch(() => ({}));
    addressLabel = formatAddress(geo.address || {});
  } catch (e) {}

  showReceiptForm(parsed, photoData, lat, lon, addressLabel);
}

    el.addEventListener('click', () => {
      panel.querySelectorAll('#workPicker .qopt').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      isWork = el.getAttribute('data-work') === '1';
    });
  });

  let pinFrom = lat === null ? 'receipt' : 'phone';
  panel.querySelectorAll('#pinPicker .qopt').forEach(el => {
    el.addEventListener('click', () => {
      panel.querySelectorAll('#pinPicker .qopt').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      pinFrom = el.getAttribute('data-pin');
    });
  });

  document.getElementById('cancelReceiptBtn').addEventListener('click', closePanel);

  document.getElementById('saveReceiptBtn').addEventListener('click', async function () {
    const btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    const v = id => (document.getElementById(id).value || '').trim();

    let useLat = lat, useLon = lon, useLabel = addressLabel, locSrc = lat === null ? 'none' : 'phone';
    const typedAddr = v('rAddr');
    const typedStore = v('rStore');
    const town = [p.city, p.state].filter(Boolean).join(', ');
    const tries = [];
    const usePhone = pinFrom === 'phone' && lat !== null;
    if (!usePhone) {
      if (typedAddr) tries.push({ q: typedAddr, src: 'address' });
      if (typedStore && town) tries.push({ q: typedStore + ', ' + town, src: 'store' });
      if (town && lat === null) tries.push({ q: town, src: 'town' });
    }
    let found = null;
    if (tries.length) btn.textContent = 'LOCATING';
    for (let i = 0; i < tries.length && !found; i++) {
      if (i > 0) await new Promise(r => setTimeout(r, 1200));
      try {
        const g = tries[i].src === 'address' ? await geocodeSmart(tries[i].q) : await geocodeAddress(tries[i].q);

      } catch (e) {}
    }
    const purchasedAt = receiptWhen(v('rDate'), v('rTime'), now);
    const oldReceipt = now.getTime() - purchasedAt.getTime() > 6 * 60 * 60 * 1000;
    if (found) {
      useLat = found.lat;
      useLon = found.lon;
      useLabel = found.label;
      locSrc = found.src;
    } else if (oldReceipt && !usePhone) {
      useLat = null;
      useLon = null;
      useLabel = typedAddr || 'no location';
      locSrc = 'none';
    }
    btn.textContent = 'SAVED';
    const questions = ['Store', 'Total', 'Saved', 'Tax', 'Date on receipt', 'Time on receipt', 'Address on receipt', 'Work or personal', 'Notes'];
    const answers = [v('rStore'), v('rTotal'), v('rSaved'), v('rTax'), v('rDate'), v('rTime'), v('rAddr'),
                     isWork ? 'Work' : 'Personal', v('rNotes')];
    const entry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      timestamp: receiptWhen(v('rDate'), v('rTime'), now).toISOString(),
      capturedAt: now.toISOString(),
      lat: useLat, lon: useLon,
      addressLabel: v('rStore') || useLabel,
      locSrc: locSrc,
      placeType: 'receipt',
      confidence: 5,
      formType: 'category',
      category: 'receipt',
      questions: questions,
      answers: answers,
      context: '',
      icon: CATEGORIES.receipt.icon,
      twinId: TWIN_ID,
      photo: photoData,
      receipt: {
        store: v('rStore'),
        total: parseFloat(v('rTotal')) || 0,
        saved: parseFloat(v('rSaved')) || 0,
        tax: parseFloat(v('rTax')) || 0,
        work: isWork,
        items: textToItems(v('rItems'))
      }
    };
    entries.unshift(entry);
    entries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    await saveEntries().catch(() => {});
    renderMarkers();
    if (useLat !== null) map.setView([useLat, useLon], 15);
    const pinWords = {
      address: ', pinned at receipt address',
      store: ', pinned at the store in that town',
      town: ', pinned at the town on the receipt',
      phone: ', pinned at phone location',
      none: ', no map pin, address not found'
    };
    setStatus('receipt saved' + (v('rTotal') ? ', $' + v('rTotal') : '') + (pinWords[locSrc] || ''));
    setTimeout(closePanel, 500);
  });
}

function localStamp(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}
