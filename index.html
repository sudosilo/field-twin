const hz = { crashes: false, work: false, fatal: false, days: 30, years: 5, area: 'vegas' };
const HZ_VEGAS = [36.1699, -115.1398];
const HZ_RADIUS_MI = 100;
let hzCenter = HZ_VEGAS;
let hzEvents = null, hzEventsAt = 0, hzEventsDays = 0, hzFatal = null, hzFatalYears = 0, hzInfo = null;
let hzCrashLayer = null, hzWorkLayer = null, hzFatalLayer = null, hzTimer = null;

function hzBase() { return getApiBase().replace(/\/+$/, ''); }

function decodePolyline(str) {
  const pts = [];
  let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    let b, shift = 0, res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32 && i < str.length);
    lat += (res & 1) ? ~(res >> 1) : (res >> 1);
    shift = 0; res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32 && i < str.length);
    lon += (res & 1) ? ~(res >> 1) : (res >> 1);
    pts.push([lat / 1e5, lon / 1e5]);
  }
  return pts;
}

function milesBetween(a, b, c, d) {
  const R = 3958.8, t = Math.PI / 180;
  const h = Math.sin((c - a) * t / 2) ** 2 + Math.cos(a * t) * Math.cos(c * t) * Math.sin((d - b) * t / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function hzRiskLine(lat, lon) {
  const near = (list, r) => (list || []).filter(x => Math.abs(x.lat - lat) < 0.02 && Math.abs(x.lon - lon) < 0.02 && milesBetween(lat, lon, x.lat, x.lon) <= r).length;
  const crashes = hzEvents ? near(hzEvents.filter(e => e.type === 'accidentsAndIncidents'), 0.5) : null;
  const fatal = hzFatal ? near(hzFatal, 0.5) : null;
  let out = '';
  if (crashes !== null) out += '<br>Crashes and incidents within half a mile in this window: <b>' + crashes + '</b>';
  if (fatal !== null) out += '<br>Fatal crashes on record within half a mile: <b>' + fatal + '</b>';
  return out;
}

function hzWhen(ms) { return ms ? new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; }

function hzEventPopup(e) {
  const kind = e.type === 'accidentsAndIncidents' ? 'Crash or incident' : e.type === 'closures' ? 'Closure' : 'Construction';
  return '<div class="hz-pop"><b>' + kind + '</b>' + (e.active ? ', happening now' : ', cleared') +
    '<br>' + escapeHtml([e.road, e.dir].filter(Boolean).join(' ')) +
    (e.desc ? '<br>' + escapeHtml(e.desc) : '') +
    (e.lanes ? '<br>Lanes: ' + escapeHtml(e.lanes) : '') +
    (e.closure ? '<br>Full closure' : '') +
    '<br>Reported ' + hzWhen(e.reported || e.start || e.firstSeen) +
    (e.end ? '<br>Planned end ' + hzWhen(e.end) : '') +
    (!e.active ? '<br>Last listed ' + hzWhen(e.lastSeen) : '') +
    '<br>Source: ' + (e.src === 'az' ? 'Arizona' : 'Nevada') + ' state road department' +
    hzRiskLine(e.lat, e.lon) + '</div>';
}

function hzFatalPopup(c) {
  return '<div class="hz-pop"><b>Fatal crash</b><br>' + escapeHtml(c.date) + (c.time ? ' at ' + c.time : '') +
    (c.road ? '<br>' + escapeHtml(c.road) : '') +
    '<br>' + c.fatals + (c.fatals === 1 ? ' death' : ' deaths') + (c.vehicles ? ', ' + c.vehicles + ' vehicles' : '') +
    '<br>Source: federal fatal crash records' + hzRiskLine(c.lat, c.lon) + '</div>';
}

async function hzLoadEvents(force) {
  const base = hzBase();
  if (!base) throw new Error('set the service address under Settings first');
  if (!force && hzEvents && hzEventsDays === hz.days && Date.now() - hzEventsAt < 5 * 60 * 1000) return;
  const r = await fetch(base + '/events?days=' + hz.days);
  if (r.status === 404) throw new Error('the service needs the latest update');
  if (!r.ok) throw new Error('service status ' + r.status);
  const j = await r.json();
  hzEvents = j.events || [];
  hzInfo = j;
  hzEventsAt = Date.now();
  hzEventsDays = hz.days;
}

async function hzLoadFatal() {
  if (hzFatal && hzFatalYears === hz.years) return;
  const base = hzBase();
  if (!base) throw new Error('set the service address under Settings first');
  const r = await fetch(base + '/crashes?years=' + hz.years);
  if (r.status === 404) throw new Error('the service needs the latest update');
  if (!r.ok) throw new Error('service status ' + r.status);
  const j = await r.json();
  hzFatal = j.crashes || [];
  hzFatalYears = hz.years;
}

function hzOkPoint(lat, lon) {
  return Number.isFinite(lat) && Number.isFinite(lon) && !(Math.abs(lat) < 0.5 && Math.abs(lon) < 0.5) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
}

function hzInArea(lat, lon) {
  if (!hzOkPoint(lat, lon)) return false;
  if (hz.area === 'all' || !hzCenter) return true;
  return milesBetween(hzCenter[0], hzCenter[1], lat, lon) <= HZ_RADIUS_MI;
}

function hzLine(e) {
  let pts = null;
  if (e.poly) { try { pts = decodePolyline(e.poly); } catch (err) { pts = null; } }
  if ((!pts || pts.length < 2) && hzOkPoint(e.lat2, e.lon2) && (e.lat2 !== e.lat || e.lon2 !== e.lon)) pts = [[e.lat, e.lon], [e.lat2, e.lon2]];
  if (!pts || pts.length < 2) return null;
  if (pts.some(p => !hzOkPoint(p[0], p[1]) || milesBetween(e.lat, e.lon, p[0], p[1]) > 150)) return null;
  return pts;
}

async function hzSetCenter() {
  if (hz.area === 'vegas') { hzCenter = HZ_VEGAS; return; }
  if (hz.area === 'all') { hzCenter = null; return; }
  try {
    const pos = await getPosition();
    hzCenter = [pos.coords.latitude, pos.coords.longitude];
  } catch (e) {
    hzCenter = HZ_VEGAS;
    setStatus('no position, showing hazards near Las Vegas');
  }
}

function hzDraw() {
  [hzCrashLayer, hzWorkLayer, hzFatalLayer].forEach(l => { if (l) map.removeLayer(l); });
  hzCrashLayer = hzWorkLayer = hzFatalLayer = null;
  if (hz.fatal && hzFatal) {
    hzFatalLayer = L.layerGroup();
    hzFatal.filter(c => hzInArea(c.lat, c.lon)).forEach(c => {
      L.circleMarker([c.lat, c.lon], { radius: 4 + Math.min(4, c.fatals), color: '#0a1b2e', weight: 1.5, fillColor: '#7a1020', fillOpacity: 0.75 })
        .bindPopup(() => hzFatalPopup(c)).addTo(hzFatalLayer);
    });
    hzFatalLayer.addTo(map);
  }
  if (hz.work && hzEvents) {
    hzWorkLayer = L.layerGroup();
    hzEvents.filter(e => e.type !== 'accidentsAndIncidents' && hzInArea(e.lat, e.lon)).forEach(e => {
      const color = e.type === 'closures' ? '#b00020' : '#e07b00';
      const style = { color: color, weight: 6, opacity: e.active ? 0.9 : 0.4, dashArray: e.active ? null : '6 8', lineCap: 'round' };
      const pts = hzLine(e);
      const line = pts ? L.polyline(pts, style) : null;
      const dot = L.circleMarker([e.lat, e.lon], { radius: 7, color: '#0a1b2e', weight: 2, fillColor: color, fillOpacity: e.active ? 0.95 : 0.45 });
      if (line) line.bindPopup(() => hzEventPopup(e)).addTo(hzWorkLayer);
      dot.bindPopup(() => hzEventPopup(e)).addTo(hzWorkLayer);
    });
    hzWorkLayer.addTo(map);
  }
  if (hz.crashes && hzEvents) {
    hzCrashLayer = L.layerGroup();
    hzEvents.filter(e => e.type === 'accidentsAndIncidents' && hzInArea(e.lat, e.lon)).forEach(e => {
      L.circleMarker([e.lat, e.lon], { radius: e.active ? 8 : 6, color: '#0a1b2e', weight: 2, fillColor: '#d32f2f', fillOpacity: e.active ? 0.95 : 0.4 })
        .bindPopup(() => hzEventPopup(e)).addTo(hzCrashLayer);
    });
    hzCrashLayer.addTo(map);
  }
}

function hzButtons() {
  setToggle('hzCrashBtn', hz.crashes);
  setToggle('hzWorkBtn', hz.work);
  setToggle('hzFatalBtn', hz.fatal);
  document.getElementById('hzDays').value = String(hz.days);
  document.getElementById('hzYears').value = String(hz.years);
  document.getElementById('hzArea').value = hz.area;

async function hzRefresh(force) {
  hzButtons();
  try { localStorage.setItem('hazardView', JSON.stringify(hz)); } catch (e) {}
  if (hzTimer) { clearInterval(hzTimer); hzTimer = null; }
  if (!hz.crashes && !hz.work && !hz.fatal) { hzDraw(); return; }
  const msgs = [];
  if (hz.crashes || hz.work) {
    setStatus('loading crashes and construction');
    try {
      await hzLoadEvents(force);
      await hzSetCenter();
      const inside = hzEvents.filter(e => hzInArea(e.lat, e.lon));
      const c = inside.filter(e => e.type === 'accidentsAndIncidents').length;
      const w = inside.length - c;
      if (hz.crashes) msgs.push(c + ' crashes');
      if (hz.work) msgs.push(w + ' construction');
      hzTimer = setInterval(() => hzRefresh(true), 10 * 60 * 1000);
    } catch (e) { msgs.push('hazards did not load, ' + e.message); }
  }
  if (hz.fatal) {
    setStatus('loading fatal crash history');
    try { await hzLoadFatal(); await hzSetCenter(); msgs.push(hzFatal.filter(c => hzInArea(c.lat, c.lon)).length + ' fatal crashes'); } catch (e) { msgs.push('fatal history did not load, ' + e.message); }
  }
  hzDraw();
  setStatus(msgs.join(', '));
}

function initHazards() {
  try { Object.assign(hz, JSON.parse(localStorage.getItem('hazardView') || '{}')); } catch (e) {}
  hzButtons();
  document.getElementById('hzCrashBtn').addEventListener('click', () => { hz.crashes = !hz.crashes; hzRefresh(false); });
  document.getElementById('hzWorkBtn').addEventListener('click', () => { hz.work = !hz.work; hzRefresh(false); });
  document.getElementById('hzFatalBtn').addEventListener('click', () => { hz.fatal = !hz.fatal; hzRefresh(false); });
  document.getElementById('hzDays').addEventListener('change', e => { hz.days = Number(e.target.value) || 30; hzRefresh(true); });
  document.getElementById('hzArea').addEventListener('change', e => { hz.area = e.target.value; hzRefresh(false); });
  document.getElementById('hzYears').addEventListener('change', e => { hz.years = Number(e.target.value) || 5; hzFatal = null; hzRefresh(false); });
  if (hz.crashes || hz.work || hz.fatal) hzRefresh(false);
}

function storeKey(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

function sameStore(a, b) {
  const x = storeKey(a), y = storeKey(b);
  if (!x || !y) return false;
  return x === y || (x.length >= 4 && y.length >= 4 && (x.indexOf(y) !== -1 || y.indexOf(x) !== -1));
}

// A receipt counts as a likely duplicate when the total matches to the cent and one more thing lines up:
// the printed date and time, the printed date and the store, or (no date) the store within a quarter mile.
function receiptDupes(r, skipId) {
  const cents = Math.round((Number(r.total) || 0) * 100);
  if (!cents) return [];
  return entries.filter(e => {
    if (e.id === skipId || e.category !== 'receipt' || !e.receipt) return false;
    if (Math.round((Number(e.receipt.total) || 0) * 100) !== cents) return false;
    const a = e.answers || [];
    const d = String(a[4] || '').trim(), t = String(a[5] || '').trim();
    const store = sameStore(e.receipt.store, r.store);
    if (r.date && d && r.date === d) {
      if (r.time && t) return r.time.slice(0, 5) === t.slice(0, 5);
      return store || !r.store || !e.receipt.store;
    }
    if (r.date && d) return false;
    if (!store) return false;
    if (hasPos(e) && Number.isFinite(r.lat) && Number.isFinite(r.lon)) return milesBetween(e.lat, e.lon, r.lat, r.lon) <= 0.25;
    return true;
  });
}

function receiptDupePairs() {
  const rs = entries.filter(e => e.category === 'receipt' && e.receipt);
  const pairs = [], seen = new Set();
  rs.forEach(e => {
    const a = e.answers || [];
    receiptDupes({ total: e.receipt.total, store: e.receipt.store, date: String(a[4] || '').trim(), time: String(a[5] || '').trim(), lat: e.lat, lon: e.lon }, e.id).forEach(o => {
      const k = [e.id, o.id].sort().join('|');
      if (!seen.has(k)) { seen.add(k); pairs.push([e, o]); }
    });
  });
  return pairs;
}

function receiptLine(e) {
  const a = e.answers || [];
  return escapeHtml((e.receipt.store || 'Unnamed store') + ', $' + (Number(e.receipt.total) || 0).toFixed(2) + ', ' + ([a[4], a[5]].filter(Boolean).join(' ') || new Date(e.timestamp).toLocaleDateString()));
}

function showSpend() {
  const panel = document.getElementById('panel');
  const rs = entries.filter(e => e.category === 'receipt' && e.receipt);
  let spent = 0, work = 0, personal = 0, saved = 0;
  rs.forEach(e => {
    spent += e.receipt.total;
    saved += e.receipt.saved;
    if (e.receipt.work) work += e.receipt.total; else personal += e.receipt.total;
  });
  const byStore = {};
  rs.forEach(e => {
    const k = e.receipt.store || 'unnamed';
    if (!byStore[k]) byStore[k] = { visits: 0, spent: 0, saved: 0 };
    byStore[k].visits++;
    byStore[k].spent += e.receipt.total;
    byStore[k].saved += e.receipt.saved;
  });

  let html = '<h2>SPEND</h2>';
  html += '<div class="meta-line">' + rs.length + ' receipts</div>';
  html += '<div style="font-size:30px;color:var(--accent);margin:8px 0;">$' + spent.toFixed(2) + '</div>';
  html += '<div class="meta-line">work $' + work.toFixed(2) + '</div>';
  html += '<div class="meta-line">personal $' + personal.toFixed(2) + '</div>';
  html += '<div class="meta-line">saved $' + saved.toFixed(2) + '</div>';
  html += '<div class="question">By store</div>';
  Object.keys(byStore).sort((a, b) => byStore[b].spent - byStore[a].spent).forEach(k => {
    const s = byStore[k];
    html += '<div class="meta-line">' + escapeHtml(k) + ', ' + s.visits + ' visits, $' + s.spent.toFixed(2) +
            (s.saved ? ', saved $' + s.saved.toFixed(2) : '') + '</div>';
  });
  if (!rs.length) html += '<div class="meta-line">no receipts captured yet</div>';
  const pairs = receiptDupePairs();
  if (pairs.length) {
    html += '<div class="question">Possible duplicates</div>';
    html += '<div class="meta-line">Same total to the cent, plus the same printed date and time, or the same date and store. Tap one to open it, and delete the extra from its Edit screen.</div>';
    pairs.forEach(([a, b]) => {
      html += '<div style="padding:8px 0;border-bottom:1px solid var(--line);"><div class="meta-line" data-dupe="' + a.id + '" style="cursor:pointer;color:var(--accent);">' + receiptLine(a) + '</div><div class="meta-line" data-dupe="' + b.id + '" style="cursor:pointer;color:var(--accent);">' + receiptLine(b) + '</div></div>';
    });
  }
  html += '<div class="panel-actions"><button class="secondary" id="closeSpendBtn">CLOSE</button></div>';
  panel.innerHTML = html;
  panel.scrollTop = 0;
  panel.classList.add('open');
  document.getElementById('closeSpendBtn').addEventListener('click', closePanel);
  panel.querySelectorAll('[data-dupe]').forEach(el => el.addEventListener('click', () => {
    const e = entries.find(x => x.id === el.getAttribute('data-dupe'));
    if (e) showEntry(e, true);
  }));
}

function dayLogN(n, word) {
  return n + ' ' + word + (n === 1 ? '' : 's');
}

function dayLogTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function dayLogGap(mins) {
  if (mins < 60) return mins + ' min';
  const h = Math.floor(mins / 60), m = mins % 60;
  return h + ' hr' + (m ? ' ' + m + ' min' : '');
}

function dayLogDays() {
  const set = {};
  entries.forEach(e => { if (e.timestamp) set[localDay(e.timestamp)] = (set[localDay(e.timestamp)] || 0) + 1; });
  return set;
}

function dayLogDetail(e) {
  if (e.category === 'receipt' && e.receipt) {
    return (e.receipt.store || 'unnamed store') + ', $' + (Number(e.receipt.total) || 0).toFixed(2) + (e.receipt.work ? ', work' : ', personal');
  }
  if (e.category === 'odometer' && e.odometer) {
    const n = (e.answers || [])[3];
    return 'odometer ' + e.odometer.reading + (e.odometer.vehicle ? ', ' + e.odometer.vehicle : '') + (e.odometer.work ? ', work' : ', personal') + (n ? ', note: ' + n : '');
  }
  const asked = (e.questions || []).length;
  let d = asked ? dayLogAnswered(e) + ' of ' + asked + ' questions answered' : 'no form';
  if (e.context) d += ', note: ' + (e.context.length > 90 ? e.context.slice(0, 90) + '...' : e.context);
  return d;
}

function dayLogAnswered(e) {
  return (e.answers || []).filter(a => a && String(a).trim() !== '').length;
}

function buildDayLog(dk) {
  entries.forEach(odoFromAnswers);
  const list = entries.filter(e => e.timestamp && localDay(e.timestamp) === dk)
    .slice().sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  const label = new Date(dk + 'T12:00:00').toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const r = { dk: dk, label: label, list: list, lines: [], gaps: [] };
  if (!list.length) return r;

  const first = list[0], last = list[list.length - 1];
  const spanMin = Math.round((new Date(last.timestamp) - new Date(first.timestamp)) / 60000);
  const cats = {};
  const sites = {};
  let ground = 0, prevPos = null, photos = 0, asked = 0, answered = 0, noPos = 0;
  list.forEach(e => {
    const c = e.category || 'general';
    cats[c] = (cats[c] || 0) + 1;
    if (hasPos(e)) {
      sites[siteKey(e)] = true;
      if (prevPos) ground += milesBetween(prevPos.lat, prevPos.lon, e.lat, e.lon);
      prevPos = e;
    } else noPos++;
    if (e.photo || e.photoPath) photos++;
    if (c !== 'receipt' && c !== 'odometer') {
      asked += (e.questions || []).length;
      answered += dayLogAnswered(e);
    }
  });

  const rs = list.filter(e => e.category === 'receipt' && e.receipt);
  let spent = 0, work = 0, personal = 0, saved = 0, tax = 0;
  const byStore = {};
  rs.forEach(e => {
    const t = Number(e.receipt.total) || 0;
    spent += t;
    saved += Number(e.receipt.saved) || 0;
    tax += Number(e.receipt.tax) || 0;
    if (e.receipt.work) work += t; else personal += t;
    const k = e.receipt.store || 'unnamed store';
    byStore[k] = (byStore[k] || 0) + t;
  });

  const legs = mileageLegs().filter(g => localDay(g.entry.timestamp) === dk);
  let workMi = 0, persMi = 0;
  legs.forEach(g => { if (g.miles > 0) { if (g.entry.odometer.work) workMi += g.miles; else persMi += g.miles; } });
  const odos = list.filter(e => e.category === 'odometer');

  r.summary = [
    (list.length === 1 ? '1 entry' : list.length + ' entries') + ' from ' + dayLogTime(first.timestamp) + ' to ' + dayLogTime(last.timestamp) + ', ' + dayLogGap(spanMin) + ' on the clock',
    dayLogN(Object.keys(sites).length, 'distinct place') + ', ' + (Math.round(ground * 10) / 10) + ' miles between entries in a straight line',
    (window.FieldTwinNative ? 'Miles driven by phone GPS: ' + (() => { try { return window.FieldTwinNative.dayMiles(dk); } catch (e) { return 'unknown'; } })() + '. ' : '') + 'Miles driven by odometer: ' + (odos.length ? (Math.round((workMi + persMi) * 10) / 10) + ' (work ' + (Math.round(workMi * 10) / 10) + ', personal ' + (Math.round(persMi * 10) / 10) + ')' : 'unknown'),
    'Spent: $' + spent.toFixed(2) + ' on ' + dayLogN(rs.length, 'receipt') + ' (work $' + work.toFixed(2) + ', personal $' + personal.toFixed(2) + ', tax $' + tax.toFixed(2) + ', saved $' + saved.toFixed(2) + ')',
    'Questions answered: ' + answered + ' of ' + asked + ', photos: ' + photos
  ];
  r.kinds = Object.keys(cats).sort((a, b) => cats[b] - cats[a]).map(k => ((CATEGORIES[k] || CATEGORIES.general).label) + ' ' + cats[k]);
  r.stores = Object.keys(byStore).sort((a, b) => byStore[b] - byStore[a]).map(k => k + ' $' + byStore[k].toFixed(2));

  let prevT = null;
  list.forEach(e => {
    const t = new Date(e.timestamp);
    const gap = prevT === null ? null : Math.round((t - prevT) / 60000);
    if (gap !== null && gap >= 120) r.gaps.push('Nothing logged for ' + dayLogGap(gap) + ', from ' + dayLogTime(prevT) + ' to ' + dayLogTime(t));
    prevT = t;
    const m = CATEGORIES[e.category || 'general'] || CATEGORIES.general;
    r.lines.push({ entry: e, time: dayLogTime(e.timestamp), gap: gap, kind: m.label, icon: m.icon, place: e.addressLabel || 'no address', detail: dayLogDetail(e) });
  });

  if (!odos.length) r.gaps.push('No odometer readings, so miles driven are unknown');
  else if (!legs.some(g => g.miles > 0)) r.gaps.push('Odometer readings exist but none follows an earlier reading on the same vehicle, so miles driven are unknown');
  if (!rs.length) r.gaps.push('No receipts captured');
  const badRs = rs.filter(e => !e.receipt.store || !(Number(e.receipt.total) > 0)).length;
  if (badRs) r.gaps.push(dayLogN(badRs, 'receipt') + ' missing a store name or total');
  const seen = {};
  let dupes = 0;
  rs.forEach(e => {
    const k = (e.receipt.store || '') + '|' + (Number(e.receipt.total) || 0).toFixed(2) + '|' + dayLogTime(e.timestamp);
    if (seen[k]) dupes++; else seen[k] = true;
  });
  if (dupes) r.gaps.push(dayLogN(dupes, 'receipt') + ' matching another on store, total and time, likely duplicate');
  const blank = list.filter(e => ['receipt', 'odometer', 'none'].indexOf(e.category) === -1 && (e.questions || []).length && dayLogAnswered(e) === 0).length;
  if (blank) r.gaps.push(dayLogN(blank, 'stop') + ' with no questions answered');
  if (noPos) r.gaps.push((noPos === 1 ? '1 entry' : noPos + ' entries') + ' with no location');
  return r;
}

function dayLogText(r) {
  const out = ['FIELD TWIN DAY LOG', r.label, ''];
  if (!r.list.length) { out.push('No entries on this day.'); return out.join('\n'); }
  out.push('SUMMARY');
  r.summary.forEach(s => out.push(s));
  out.push('Kinds of stops: ' + r.kinds.join(', '));
  if (r.stores.length) out.push('By store: ' + r.stores.join(', '));
  out.push('', 'TIMELINE');
  r.lines.forEach(l => {
    out.push(l.time + (l.gap !== null ? ' (+' + dayLogGap(l.gap) + ')' : '') + ', ' + l.kind + ', ' + l.place + ', ' + l.detail);
  });
  out.push('', 'NOT CAPTURED');
  if (r.gaps.length) r.gaps.forEach(g => out.push(g)); else out.push('Nothing flagged.');
  return out.join('\n');
}

function showDayLog(dk) {
  const panel = document.getElementById('panel');
  dk = dk || localDay(new Date());
  const days = dayLogDays();
  const keys = Object.keys(days).sort();
  const prev = keys.filter(k => k < dk).pop() || '';
  const next = keys.filter(k => k > dk)[0] || '';
  const r = buildDayLog(dk);

  let html = '<h2>DAY LOG</h2>';
  html += '<div class="meta-line">' + escapeHtml(r.label) + '</div>';

  html += '<div class="panel-actions" style="margin-top:6px;"><button class="secondary" id="dlPrev"' + (prev ? '' : ' disabled') + '>EARLIER DAY</button><button class="secondary" id="dlNext"' + (next ? '' : ' disabled') + '>LATER DAY</button></div>';
  html += '<div class="meta-line">The earlier and later buttons skip to the nearest day that has entries. ' + keys.length + ' days have entries.</div>';

  if (!r.list.length) {
    html += '<div class="question">No entries on this day</div>';
  } else {
    html += '<div style="font-size:30px;color:var(--accent);margin:10px 0 0;">' + r.list.length + '</div><div class="meta-line">entries</div>';
    html += '<div class="question">Summary</div>';
    r.summary.forEach(s => { html += '<div class="meta-line">' + escapeHtml(s) + '</div>'; });
    html += '<div class="meta-line">Kinds of stops: ' + escapeHtml(r.kinds.join(', ')) + '</div>';
    if (r.stores.length) html += '<div class="meta-line">By store: ' + escapeHtml(r.stores.join(', ')) + '</div>';
    html += '<div class="question">Timeline</div>';
    r.lines.forEach((l, i) => {
      html += '<div class="mi-row" data-dl="' + i + '">' + l.icon + ' ' + l.time + (l.gap !== null ? ', ' + dayLogGap(l.gap) + ' after the last entry' : ', first entry') +

    });
    html += '<div class="question">Not captured</div>';
    if (r.gaps.length) r.gaps.forEach(g => { html += '<div class="meta-line" style="color:#b00020;">' + escapeHtml(g) + '</div>'; });
    else html += '<div class="meta-line">Nothing flagged.</div>';
  }
  html += '<div class="meta-line" id="dlMsg"></div>';
  html += '<div class="panel-actions"><button id="dlCopyBtn">COPY LOG</button><button class="secondary" id="dlCloseBtn">CLOSE</button></div>';
  panel.innerHTML = html;
  panel.scrollTop = 0;
  panel.classList.add('open');

  document.getElementById('dlCloseBtn').addEventListener('click', closePanel);
  document.getElementById('dlDate').addEventListener('change', ev => { if (ev.target.value) showDayLog(ev.target.value); });
  document.getElementById('dlPrev').addEventListener('click', () => { if (prev) showDayLog(prev); });
  document.getElementById('dlNext').addEventListener('click', () => { if (next) showDayLog(next); });
  panel.querySelectorAll('[data-dl]').forEach(el => {
    el.addEventListener('click', () => showEntry(r.lines[parseInt(el.getAttribute('data-dl'), 10)].entry, true));
  });
  document.getElementById('dlCopyBtn').addEventListener('click', async () => {
    const text = dayLogText(r);
    const msg = document.getElementById('dlMsg');
    try {
      await navigator.clipboard.writeText(text);
      msg.textContent = 'Day log copied.';
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); msg.textContent = 'Day log copied.'; } catch (x) { msg.textContent = 'Copy blocked by the browser.'; }
      ta.remove();
    }
  });
}

function getDirtyIds() {
  try { return new Set(JSON.parse(localStorage.getItem('dirtyIds') || '[]')); } catch (e) { return new Set(); }
}

function setDirtyIds(set) {
  try { localStorage.setItem('dirtyIds', JSON.stringify(Array.from(set))); } catch (e) {}
}

function localStamp(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function showEdit(entry, fromHistory) {
  const panel = document.getElementById('panel');
  const isReceipt = entry.category === 'receipt';
  const questions = (entry.questions || []).map(q => (q && typeof q === 'object') ? q.text : q);
  const answers = (entry.answers || []).slice();
  while (answers.length < questions.length) answers.push('');
  const notesIdx = questions.indexOf('Notes');
  const workIdx = isReceipt ? questions.indexOf('Work or personal') : -1;
  const addrIdx = isReceipt ? questions.indexOf('Address on receipt') : -1;
  const originalAddr = addrIdx >= 0 ? (answers[addrIdx] || '') : '';
  let isWork = entry.receipt ? Boolean(entry.receipt.work) : (workIdx >= 0 && answers[workIdx] === 'Work');

  let html = '<h2>EDIT</h2>';
  html += '<div class="question">Name shown in history</div>';
  html += '<input type="text" id="edLabel" value="' + escapeHtml(entry.addressLabel || '') + '">';
  if (!isReceipt) {
    html += '<div class="question">Date and time</div>';
    html += '<input type="datetime-local" id="edWhen" value="' + localStamp(new Date(entry.timestamp)) + '" style="width:100%;padding:8px;font-size:14px;margin-top:4px;border:1px solid var(--line);background:#f9fafb;color:var(--text);">';
    html += '<div class="question">Type</div>';
    html += '<select id="edCat">';
    Object.keys(CATEGORIES).filter(k => k !== 'none' && k !== 'receipt' && k !== 'odometer').forEach(k => {
      const sel = (entry.category || 'general') === k ? ' selected' : '';
      html += '<option value="' + k + '"' + sel + '>' + CATEGORIES[k].icon + ' ' + CATEGORIES[k].label + '</option>';
    });
    html += '</select>';
    html += '<div class="question">Context</div>';
    html += '<textarea id="edContext">' + escapeHtml(entry.context || '') + '</textarea>';
  }
  questions.forEach((q, i) => {
    if (i === notesIdx) return;
    if (i === workIdx) {
      html += '<div class="question">Work or personal</div>';
      html += '<div class="icon-picker" id="edWork">';
      html += '<div class="icon-choice qopt' + (isWork ? ' active' : '') + '" data-work="1" style="font-size:12px;">Work</div>';
      html += '<div class="icon-choice qopt' + (isWork ? '' : ' active') + '" data-work="0" style="font-size:12px;">Personal</div>';
      html += '</div>';
      return;
    }
    const label = i === addrIdx ? 'Address on receipt' : q;
    html += '<div class="question">' + escapeHtml(label) + '</div>';
    html += '<input type="text" class="edAns" data-i="' + i + '" value="' + escapeHtml(answers[i] || '') + '">';
  });
  if (!isReceipt) {
    html += '<div class="question">Move the map pin to this address, leave empty to leave the pin where it is</div>';
    html += '<input type="text" id="edMove">';
  } else {
    html += '<div class="question">Map pin</div>';
    html += '<select id="edPin"><option value="auto">Move it when the address above changes</option><option value="move">Find the address above and move the pin there now</option><option value="stay">Leave the pin where it is</option></select>';
  }
  if (isReceipt) {
    html += '<div class="question">Items, one per line, name then a bar then the price</div>';
    html += '<textarea id="edItems" style="min-height:120px;">' + escapeHtml(itemsToText((entry.receipt && entry.receipt.items) || [])) + '</textarea>';
    if (entry.photo || entry.photoPath) {
      html += '<button class="secondary" id="edReread" style="margin-top:8px;width:100%;">READ ITEMS FROM THE PHOTO</button>';
    }
  }
  html += '<div class="question">Notes</div>';
  html += '<textarea id="edNotes">' + escapeHtml(notesIdx >= 0 ? (answers[notesIdx] || '') : '') + '</textarea>';
  html += '<div class="panel-actions">';
  html += '<button id="edSaveBtn">SAVE CHANGES</button>';
  html += '<button class="secondary" id="edCancelBtn">CANCEL</button>';
  html += '<button class="secondary" id="edDeleteBtn" style="color:#b00020;border-color:#b00020;">DELETE</button>';
  html += '</div>';
  panel.innerHTML = html;
  panel.scrollTop = 0;
  panel.classList.add('open');

  panel.querySelectorAll('#edWork .qopt').forEach(el => {
    el.addEventListener('click', () => {
      panel.querySelectorAll('#edWork .qopt').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      isWork = el.getAttribute('data-work') === '1';
    });
  });

  document.getElementById('edCancelBtn').addEventListener('click', () => showEntry(entry, fromHistory));
  document.getElementById('edDeleteBtn').addEventListener('click', async function () {
    if (this.getAttribute('data-armed') !== '1') {
      this.setAttribute('data-armed', '1');
      this.textContent = 'TAP AGAIN TO DELETE';
      return;
    }
    this.disabled = true;
    await deleteEntry(entry);
    if (fromHistory === 'search') { closePanel(); openSearch(); }
    else if (fromHistory) showHistory();
    else closePanel();
  });

  const rereadBtn = document.getElementById('edReread');
  if (rereadBtn) {
    rereadBtn.addEventListener('click', async () => {
      rereadBtn.disabled = true;
      rereadBtn.textContent = 'READING';
      try {
        const data = await entryPhotoData(entry);
        if (!data) throw new Error('photo not available');
        const r = await extractWithVision(data);
        const found = cleanItems(r.items);
        document.getElementById('edItems').value = itemsToText(found);
        rereadBtn.textContent = found.length ? 'ITEMS READ, REVIEW THEN SAVE' : 'NO ITEMS FOUND ON THE PHOTO';
      } catch (e) {
        rereadBtn.textContent = 'COULD NOT READ, ' + e.message;
      }
      rereadBtn.disabled = false;
    });
  }

  document.getElementById('edSaveBtn').addEventListener('click', async function () {
    const btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    const val = id => { const el = document.getElementById(id); return el ? (el.value || '').trim() : ''; };

    panel.querySelectorAll('.edAns').forEach(el => {
      answers[parseInt(el.getAttribute('data-i'), 10)] = (el.value || '').trim();
    });
    if (workIdx >= 0) answers[workIdx] = isWork ? 'Work' : 'Personal';
    const notes = val('edNotes');
    if (notesIdx >= 0) {
      answers[notesIdx] = notes;
    } else if (notes) {
      questions.push('Notes');
      answers.push(notes);
    }
    entry.questions = questions;
    entry.answers = answers;

    let moveTo = '';
    let pinNote = '';
    if (isReceipt) {
      const get = name => { const i = questions.indexOf(name); return i >= 0 ? answers[i] : ''; };
      entry.receipt = {
        store: get('Store'),
        total: parseFloat(get('Total')) || 0,
        saved: parseFloat(get('Saved')) || 0,
        tax: parseFloat(get('Tax')) || 0,
        work: isWork,
        items: textToItems(val('edItems'))
      };
      if (!entry.capturedAt) entry.capturedAt = entry.timestamp;
      entry.timestamp = receiptWhen(get('Date on receipt'), get('Time on receipt'), new Date(entry.timestamp)).toISOString();
      const newAddr = get('Address on receipt');
      const pinChoice = val('edPin') || 'auto';
      if (newAddr && pinChoice === 'move') moveTo = newAddr;
      else if (newAddr && pinChoice === 'auto' && newAddr !== originalAddr) moveTo = newAddr;
    } else {
      const when = new Date(val('edWhen'));
      if (!isNaN(when.getTime())) entry.timestamp = when.toISOString();
      const cat = val('edCat') || 'general';
      if (cat !== (entry.category || 'general')) {
        entry.category = cat === 'general' ? null : cat;
        entry.icon = CATEGORIES[cat].icon;
        entry.formType = cat === 'general' ? 'full' : 'category';
        entry.placeType = CATEGORIES[cat].label;
      }
      entry.context = val('edContext');
      moveTo = val('edMove');
    }
    entry.addressLabel = val('edLabel') || entry.addressLabel;

    if (moveTo) {
      btn.textContent = 'LOCATING';
      try {
        const g = await geocodeSmart(moveTo);
        entry.lat = g.lat;
        entry.lon = g.lon;
        entry.locSrc = 'address';
        pinNote = ', pin moved';
        pinNotice = { id: entry.id, ok: true, text: g.exact ? 'Pin moved to the address.' : 'The exact street number was not on the map, so the pin was moved to that street. Tap the four arrows button at the top right to set the exact spot.' };
      } catch (e) {
        pinNote = ', address not found so the pin stayed';
        pinNotice = { id: entry.id, ok: false, text: 'The map service could not find that address, so the pin did not move. Tap the four arrows button at the top right, then tap the map to set it.' };
      }
    }

    entry.updatedAt = new Date().toISOString();
    const dirty = getDirtyIds();
    dirty.add(entry.id);
    setDirtyIds(dirty);
    entries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    await saveEntries().catch(() => {});
    renderMarkers();
    if (pinNote === ', pin moved') map.setView([entry.lat, entry.lon], 15);
    setStatus('changes saved' + pinNote);
    showEntry(entry, fromHistory);
  });
}

function showEntry(entry, fromHistory) {
  const panel = document.getElementById('panel');
  let html = '<div class="entry-head"><h2>ENTRY</h2><button class="secondary" id="movePinBtn" aria-label="Move pin" title="Move pin"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button></div>';
  if (pinNotice && pinNotice.id === entry.id) {
    html += '<div style="margin:6px 0;padding:8px;border:1px solid ' + (pinNotice.ok ? 'var(--accent-dim)' : '#b00020') + ';color:' + (pinNotice.ok ? 'var(--text)' : '#b00020') + ';font-size:13px;">' + escapeHtml(pinNotice.text) + '</div>';
    pinNotice = null;
  }
  if (!hasPos(entry)) {
    html += '<div class="meta-line">no map pin</div>';
  }
  html += '<div class="meta-line">' + new Date(entry.timestamp).toLocaleString() + '</div>';
  html += '<div class="meta-line">' + entry.addressLabel + '</div>';
  if (entry.photo) {
    html += '<img src="' + entry.photo + '" style="max-width:100%;margin-top:8px;">';
  } else if (entry.photoPath) {
    html += '<img id="cloudPhoto" style="max-width:100%;margin-top:8px;">';
  }
  let shown = false;
  if (entry.context) {
    html += '<div class="question">Context</div><div>' + escapeHtml(entry.context) + '</div>';
    shown = true;
  }
  (entry.questions || []).forEach((q, i) => {
    const a = (entry.answers || [])[i];
    if (a === undefined || a === null || String(a).trim() === '') return;
    const label = (q && typeof q === 'object') ? q.text : q;
    html += '<div class="question">' + escapeHtml(label) + '</div><div>' + escapeHtml(String(a)) + '</div>';
    shown = true;
  });
  if (entry.receipt && entry.receipt.items && entry.receipt.items.length) {
    html += '<div class="question">Items</div>';
    entry.receipt.items.forEach(it => {
      html += '<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line);">' +
              '<span>' + escapeHtml(it.name) + '</span><span>' + (it.price !== null && it.price !== undefined ? '$' + Number(it.price).toFixed(2) : '') + '</span></div>';
    });
    shown = true;
  }
  if (!shown) {
    html += '<div class="question">No answers recorded</div>';
  }
  if (cameras.length && hasPos(entry)) {
    const nearCams = cameras
      .map(c => ({ c: c, dist: milesBetween(entry.lat, entry.lon, c.lat, c.lon) }))
      .filter(x => x.dist <= 0.5)
      .sort((a, b) => a.dist - b.dist)
      .slice(0, 5);
    if (nearCams.length) {
      html += '<div class="question">Cameras covering this spot</div>';
      nearCams.forEach((x, i) => {
        html += '<div class="meta-line camlink" data-camidx="' + cameras.indexOf(x.c) + '" style="padding:6px 0;border-bottom:1px solid var(--line);">';
        html += escapeHtml(x.c.roadway || 'unnamed') + ', ' + x.dist.toFixed(2) + ' mi</div>';
      });
    }
  }
  html += '<div class="panel-actions"><button id="editEntryBtn">EDIT</button><button class="secondary" id="closeEntryBtn">' + (fromHistory ? 'BACK' : 'CLOSE') + '</button></div>';
  panel.innerHTML = html;
  panel.scrollTop = 0;
  panel.classList.add('open');
  if (!entry.photo && entry.photoPath) {
    cloudPhotoUrl(entry.photoPath).then(u => {
      const img = document.getElementById('cloudPhoto');
      if (img && u) img.src = u;
    }).catch(() => {});
  }
  panel.querySelectorAll('.camlink').forEach(el => {
    el.addEventListener('click', () => {
      showCamera(cameras[parseInt(el.getAttribute('data-camidx'), 10)]);
    });
  });
  document.getElementById('editEntryBtn').addEventListener('click', () => showEdit(entry, fromHistory));
  document.getElementById('movePinBtn').addEventListener('click', () => startPinPlacement(entry, fromHistory));
  document.getElementById('closeEntryBtn').addEventListener('click', () => {
    if (fromHistory === 'search') { closePanel(); openSearch(); }
    else if (fromHistory) showHistory();
    else closePanel();
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let odoLocked = false;

function closePanel() {
  if (odoLocked) return;
  document.getElementById('panel').classList.remove('open', 'odo-lock');
  document.getElementById('panel').innerHTML = '';
  pendingEntry = null;
}

function exportEntries() {
  const payload = {
    format: 'field-twin',
    version: 1,
    twinId: TWIN_ID,
    exportedAt: new Date().toISOString(),
    stats: scoreEntries(entries),
    entries: entries
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'field-twin-' + TWIN_ID + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importEntries(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const parsed = JSON.parse(reader.result);
      const incoming = Array.isArray(parsed) ? parsed : (parsed.entries || []);
      const sourceTwin = Array.isArray(parsed) ? 'unknown' : (parsed.twinId || 'unknown');
      const existingKeys = new Set(entries.map(e => e.id || (e.timestamp + e.lat + e.lon)));
      let added = 0;
      incoming.forEach(e => {
        const key = e.id || (e.timestamp + e.lat + e.lon);
        if (!existingKeys.has(key)) {
          if (!e.twinId) e.twinId = sourceTwin;
          entries.unshift(e);
          existingKeys.add(key);
          added++;
        }
      });
      entries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      await saveEntries();
      renderMarkers();
      const foreign = sourceTwin !== 'unknown' && sourceTwin !== TWIN_ID;
      setStatus('import complete, ' + added + ' new entries' + (foreign ? ', from ' + sourceTwin : ''));
    } catch (e) {
      setStatus('import failed, invalid file');
    }
  };
  reader.readAsText(file);
}

async function init() {
  const legendHtml = Object.keys(CATEGORIES).map(k => {
    const m = CATEGORIES[k];
    return '<div class="legend-row">' + signHtml(k, m.icon, 26) + '<span>' + m.label + '</span></div>';
  }).join('');
  document.getElementById('legendRows').innerHTML = legendHtml;
  setRadar(0);
  initMap();
  initCloud();
  await loadCloudSession();
  await loadEntries();
  renderMarkers();
  const firstPinned = entries.filter(hasPos)[0];
  if (firstPinned) {
    map.setView([firstPinned.lat, firstPinned.lon], 12);
  }
  setStatus(scoreEntries(entries).total + ' points, ' + entries.length + ' entries' + (cloudUser ? ', signed in' : ''));
  if (cloudUser) cloudPull().then(cloudPush);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && cloudUser && Date.now() - lastPullAt > 2 * 60 * 1000) cloudPull().then(cloudPush);
  });
  window.addEventListener('online', () => { if (cloudUser) cloudPush(); });

  document.getElementById('updateBtn').addEventListener('click', forceUpdate);
  document.getElementById('exportBtn').addEventListener('click', exportEntries);
  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importInput').click();
  });
  document.getElementById('importInput').addEventListener('change', (e) => {
    if (e.target.files[0]) importEntries(e.target.files[0]);
  });

  const menuBtn = document.getElementById('menuBtn');
  const sideMenu = document.getElementById('sideMenu');
  const menuOverlay = document.getElementById('menuOverlay');
  function openMenu() {
    sideMenu.classList.add('open');
    menuOverlay.classList.add('open');
  }
  function closeMenu() {
    sideMenu.classList.remove('open');
    menuOverlay.classList.remove('open');
  }
  menuBtn.addEventListener('click', () => {
    if (sideMenu.classList.contains('open')) closeMenu(); else openMenu();
  });
  menuOverlay.addEventListener('click', closeMenu);

  document.getElementById('historyBtn').addEventListener('click', () => {
    closeMenu();
    showHistory();
  });

  document.getElementById('searchBtn').addEventListener('click', () => {
    closeMenu();
    closePanel();
    openSearch();
  });
  document.getElementById('mapFilterClear').addEventListener('click', clearMapFilter);
  document.getElementById('pinPlaceCancel').addEventListener('click', cancelPinPlacement);

  applyMilesToggle();
  document.getElementById('settingsBtn').addEventListener('click', () => {
    const box = document.getElementById('settingsBox');
    box.hidden = !box.hidden;
    document.getElementById('settingsBtn').setAttribute('aria-expanded', box.hidden ? 'false' : 'true');
  });
  initHere();
  initRoadButtons();
  initHazards();
  document.getElementById('milesToggleBtn').addEventListener('click', () => {
    try { localStorage.setItem('milesOn', milesOn() ? '0' : '1'); } catch (e) {}
    applyMilesToggle();
  });
  document.getElementById('milesDockBtn').addEventListener('click', showOdometer);
  document.getElementById('mileageBtn').addEventListener('click', () => {
    closeMenu();
    showMileage();
  });

  document.getElementById('dayLogBtn').addEventListener('click', () => {
    closeMenu();
    showDayLog();
  });

  document.getElementById('spendBtn').addEventListener('click', () => {
    closeMenu();
    showSpend();
  });

  document.getElementById('receiptDockBtn').addEventListener('click', () => {
    document.getElementById('receiptFile').click();
  });
  document.getElementById('receiptBtn').addEventListener('click', () => {
    closeMenu();
    document.getElementById('receiptFile').click();
  });
  document.getElementById('receiptFile').addEventListener('change', (e) => {
    if (e.target.files[0]) startReceipt(e.target.files[0]);
    e.target.value = '';
  });

  document.getElementById('camerasBtn').addEventListener('click', () => {
    closeMenu();
    toggleCameras();
  });

  document.getElementById('accountBtn').addEventListener('click', () => {
    closeMenu();
    showAccount();
  });

  document.getElementById('checkBtn').addEventListener('click', () => {
    closeMenu();
    serviceCheck();
  });

  document.getElementById('camKeyBtn').addEventListener('click', () => {
    closeMenu();
    showCameraKeyPanel();
  });

  document.getElementById('infoBtn').addEventListener('click', () => {
    closeMenu();
    showInfo();
  });
}

window.addEventListener('error', (e) => {
  setStatus('JS ERROR: ' + e.message + ' (line ' + e.lineno + ')');
});
window.addEventListener('unhandledrejection', (e) => {
  const msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
  setStatus('PROMISE ERROR: ' + msg);
});

window.fieldTwinReady = init();
</script>
<script>
// Phone app extras: when Field Twin runs inside its Android app, window.FieldTwinNative is the phone side.
// It tracks location in the background, turns twenty minute parks into stops, adds up GPS miles,
// and raises odometer prompts that lock this screen until a reading is saved.
(function () {
  const N = window.FieldTwinNative;
  if (!N) return;
  try { N.hello(); } catch (e) { return; }
  document.querySelectorAll('.native-only').forEach(el => { el.hidden = false; });

  // Location comes from the phone service, which keeps running with the screen off.
  const geo = navigator.geolocation;
  const realGet = geo && geo.getCurrentPosition ? geo.getCurrentPosition.bind(geo) : null;
  function nativeFix(maxAgeMs) {
    try {
      const f = JSON.parse(N.lastFix() || 'null');
      if (f && Date.now() - f.t <= maxAgeMs) {
        return { coords: { latitude: f.lat, longitude: f.lon, accuracy: f.acc, altitude: null, altitudeAccuracy: null, heading: null, speed: f.speed >= 0 ? f.speed : null }, timestamp: f.t };
      }
    } catch (e) {}
    return null;
  }
  if (geo) {
    geo.getCurrentPosition = function (ok, fail, opts) {
      const now = nativeFix(90000);
      if (now) { ok(now); return; }
      let done = false;
      const started = Date.now();
      const limit = (opts && opts.timeout) || 20000;
      const poll = setInterval(() => {
        const f = nativeFix(90000);
        if (f && !done) { done = true; clearInterval(poll); ok(f); }
        else if (Date.now() - started > limit && !done) {
          done = true; clearInterval(poll);
          const old = nativeFix(30 * 60000);
          if (old) ok(old);
          else if (realGet) realGet(ok, fail, opts);
          else if (fail) fail({ code: 3, message: 'no location fix yet' });
        }
      }, 1000);
      if (realGet) realGet(p => { if (!done) { done = true; clearInterval(poll); ok(p); } }, () => {}, opts);
    };
    geo.watchPosition = function (ok) {
      let lastT = 0;
      return setInterval(() => {
        const f = nativeFix(120000);
        if (f && f.timestamp !== lastT) { lastT = f.timestamp; ok(f); }
      }, 5000);
    };
    geo.clearWatch = function (id) { clearInterval(id); };
  }

  // Stops: each long park becomes a regular entry, named after the closest place already logged.
  const SITE_RADIUS_M = 150;
  function metersApart(aLat, aLon, bLat, bLon) {
    const R = 6371000, toR = Math.PI / 180;
    const dLat = (bLat - aLat) * toR, dLon = (bLon - aLon) * toR;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * toR) * Math.cos(bLat * toR) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function nearestSite(lat, lon) {
    let best = null, bestD = Infinity;
    entries.forEach(e => {
      if (!hasPos(e) || e.category === 'odometer' || e.category === 'receipt' || e.placeType === 'auto stop') return;
      const d = metersApart(lat, lon, e.lat, e.lon);
      if (d < bestD && d <= SITE_RADIUS_M) { bestD = d; best = e; }
    });
    if (!best) entries.forEach(e => {
      if (!hasPos(e) || e.placeType !== 'auto stop') return;
      const d = metersApart(lat, lon, e.lat, e.lon);
      if (d < bestD && d <= SITE_RADIUS_M) { bestD = d; best = e; }
    });
    return best;
  }
  function clock(t) { return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  let importing = false;
  async function importStops() {
    if (importing) return;
    importing = true;
    try {
      let stays = [];
      try { stays = JSON.parse(N.getStays() || '[]'); } catch (e) { stays = []; }
      if (!stays.length) return;
      const have = new Set(entries.map(e => e.id));
      const done = [];
      let added = 0;
      for (const st of stays) {
        const id = 'stop-' + st.id;
        done.push(st.id);
        if (have.has(id)) continue;
        const site = nearestSite(st.lat, st.lon);
        let label = site ? (site.addressLabel || '') : '';
        if (!label) {
          try { const g = await reverseGeocode(st.lat, st.lon); label = formatAddress(g.address || {}) || 'parked spot'; } catch (e) { label = 'parked spot'; }
        }
        const cat = site && CATEGORIES[site.category] && site.category !== 'none' ? site.category : 'general';
        const mins = Math.max(1, Math.round((st.leftAt - st.arrivedAt) / 60000));
        entries.unshift({
          id: id,
          timestamp: new Date(st.arrivedAt).toISOString(),
          lat: st.lat, lon: st.lon,
          addressLabel: label,
          locSrc: 'phone app',
          placeType: 'auto stop',
          confidence: 4,
          formType: 'category',
          category: cat,
          questions: ['Arrived', 'Left', 'Minutes parked', 'GPS miles since the last stop', 'Matched a logged place', 'Notes'],
          answers: [clock(st.arrivedAt), clock(st.leftAt), String(mins), String(st.milesBefore || 0), site ? 'Yes' : 'No', ''],
          context: 'Logged automatically from a stop of ' + mins + ' minutes',
          icon: (CATEGORIES[cat] || CATEGORIES.general).icon,
          twinId: TWIN_ID
        });
        have.add(id);
        added++;
      }
      if (added) {
        entries.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        await saveEntries();
        renderMarkers();
        setStatus(added === 1 ? 'one stop logged automatically' : added + ' stops logged automatically');
      }
      N.ackStays(JSON.stringify(done));
    } finally {
      importing = false;
    }
  }

  // Odometer prompts: a tapped prompt, or opening the app while one is due, locks the screen on the odometer form.
  function checkOdometer() {
    let action = '';
    try { action = N.takeAction(); } catch (e) {}
    let due = false;
    try { due = N.odoDue(); } catch (e) {}
    if ((action === 'odo' || due) && !odoLocked) showOdometer(true);
  }

  function wake() {
    if (document.visibilityState !== 'visible') return;
    checkOdometer();
    importStops();
  }
  Promise.resolve(window.fieldTwinReady).catch(() => {}).then(() => {
    document.addEventListener('visibilitychange', wake);
    setInterval(wake, 60000);
    setTimeout(wake, 800);
  });

  // Menu switches and prompt hours.
  function readSettings() { try { return JSON.parse(N.getPromptSettings()); } catch (e) { return { on: true, start: 7, end: 18, minGap: 60, maxGap: 150 }; } }
  function paint() {
    let t = true;
    try { t = N.isTracking(); } catch (e) {}
    setToggle('autoTrackBtn', t);
    setToggle('odoPromptBtn', readSettings().on !== false);
  }
  const hourName = h => h === 0 ? 'midnight' : h === 12 ? 'noon' : h < 12 ? h + ' in the morning' : (h - 12) + (h < 18 ? ' in the afternoon' : ' at night');
  const from = document.getElementById('odoFrom'), until = document.getElementById('odoUntil'), gap = document.getElementById('odoGap');
  for (let h = 0; h < 24; h++) {
    from.add(new Option(hourName(h), String(h)));
    until.add(new Option(hourName(h), String(h)));
  }
  const cur = readSettings();
  from.value = String(cur.start);
  until.value = String(cur.end);
  const gv = cur.minGap + ',' + cur.maxGap;
  if ([...gap.options].some(o => o.value === gv)) gap.value = gv;
  function saveSettings(extra) {
    const s = readSettings();
    s.start = parseInt(from.value, 10);
    s.end = parseInt(until.value, 10);
    const g = gap.value.split(',');
    s.minGap = parseInt(g[0], 10);
    s.maxGap = parseInt(g[1], 10);
    Object.assign(s, extra || {});
    N.setPromptSettings(JSON.stringify(s));
    paint();
  }
  [from, until, gap].forEach(el => el.addEventListener('change', () => saveSettings()));
  document.getElementById('autoTrackBtn').addEventListener('click', () => {
    let t = true;
    try { t = N.isTracking(); } catch (e) {}
    N.setTracking(!t);
    setTimeout(paint, 300);
    setStatus(t ? 'auto track off' : 'auto track on');
  });
  document.getElementById('odoPromptBtn').addEventListener('click', () => {
    const on = readSettings().on !== false;
    saveSettings({ on: !on });
    setStatus(on ? 'odometer prompts off' : 'odometer prompts on');
  });
  paint();
})();
</script>
<script>
// Twin tabs: Field map is this app, Inventory is Field Twin Violet loaded in place so switching never leaves the page.
(function () {
  const TAB_KEY = 'fieldTwinTab';
  const teal = document.getElementById('tabTeal');
  const violet = document.getElementById('tabViolet');
  const view = document.getElementById('violetView');
  function show(which) {
    const inv = which === 'violet';
    teal.classList.toggle('on', !inv);
    violet.classList.toggle('on', inv);
    if (inv && !view.firstChild) {
      const f = document.createElement('iframe');
      f.src = VIOLET_SITE;
      f.title = 'Field Twin Violet inventory';
      f.allow = 'camera; clipboard-write; geolocation';
      view.appendChild(f);
    }
    view.classList.toggle('open', inv);
    try { localStorage.setItem(TAB_KEY, which); } catch (e) {}
    if (!inv && typeof map !== 'undefined' && map && map.invalidateSize) setTimeout(() => map.invalidateSize(), 50);
  }
  teal.addEventListener('click', () => show('teal'));
  document.getElementById('tabRoads').addEventListener('click', () => { window.location.href = CQ_SITE; });
  violet.addEventListener('click', () => show('violet'));
  let start = 'teal';
  try { start = localStorage.getItem(TAB_KEY) || 'teal'; } catch (e) {}
  if (location.hash === '#map') start = 'teal';
  if (location.hash === '#inventory') start = 'violet';
  show(start);
})();
</script>
