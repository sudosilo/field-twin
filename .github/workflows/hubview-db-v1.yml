name: Hub View database

# Applies the Hub View shared library tables and storage bucket to the shared Supabase project whenever the file changes.
on:
  push:
    branches: [master]
    paths: ['supabase/hubview-v1.sql', '.github/workflows/hubview-db-v1.yml']
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Hub View tables
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          [ -n "$TOKEN" ] || { echo "SUPABASE_ACCESS_TOKEN secret is not set"; exit 1; }
          f=supabase/hubview-v1.sql
          jq -Rs '{query: .}' "$f" > body.json
          out=$(curl -s -w '\n%{http_code}' -X POST https://api.supabase.com/v1/projects/zasyjjoypkpvyqdueums/database/query -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @body.json)
          code=$(echo "$out" | tail -n1)
          echo "$f: $code $(echo "$out" | head -n1 | head -c 300)"
          [ "$code" -lt 300 ] || exit 1
